<style>
/* Une seule scène plein écran : la trame de l'œil (canvas), sa voix en dessous. Aucun ATH. */
:root{
  --void:#000;
  --ink:#d8d8d2;          /* points de la trame */
  --voice:#f0f0ea;        /* texte de l'œil */
  --dim:#6b6b66;          /* panneau debug */
  --font-voice:"VT323", ui-monospace, "Courier New", monospace;
  --font-debug:ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--void);overflow:hidden;overscroll-behavior:none}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#eye{position:fixed;inset:0;width:100%;height:100%;display:block}
#cam{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
#voice{
  position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12vh);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-family:var(--font-voice);font-size:clamp(22px,6.4vw,36px);line-height:1.12;letter-spacing:.06em;
  color:var(--voice);text-transform:uppercase;text-align:center;text-wrap:balance;pointer-events:none;
}
#voice .cursor{display:inline-block;width:.5em;height:.86em;margin-left:.12em;vertical-align:-.06em;background:var(--voice);animation:blink 1.06s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#debug{
  position:fixed;margin:0;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(12px,env(safe-area-inset-left,0px));
  font:12px/1.4 var(--font-debug);color:var(--dim);white-space:pre;pointer-events:none;
}
/* La seule fenêtre du jeu : quand il te demande ce que c'est, tu lui écris. */
#ask{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 4vh);margin:0;
  width:min(84vw,420px);display:flex;align-items:center;gap:.4em;padding:.35em .6em;
  border:1px solid var(--voice);background:var(--void);
  font-family:var(--font-voice);font-size:clamp(22px,6.4vw,34px);color:var(--voice);
}
#ask[hidden]{display:none}
#ask span{flex:none}
#askInput{
  flex:1;min-width:0;border:0;outline:0;background:transparent;padding:0;margin:0;
  font:inherit;color:inherit;text-transform:uppercase;letter-spacing:.06em;caret-color:var(--voice);
  -webkit-user-select:text;user-select:text;touch-action:manipulation;
}
@media (prefers-reduced-motion:reduce){#voice .cursor{animation:none}}
</style>

<body>
<canvas id="eye" aria-label="Un œil, immobile"></canvas>
<video id="cam" playsinline muted autoplay></video>
<p id="voice" aria-live="polite"></p>
<form id="ask" hidden autocomplete="off">
  <span aria-hidden="true">&gt;</span>
  <input id="askInput" name="askInput" type="text" maxlength="40" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done" aria-label="Ta réponse">
</form>
<pre id="debug" hidden></pre>

<script>
// Séquence 1 : Premier Regard. La première des séquences où l'on retrouve l'œil.
(() => {
'use strict';

// Réglages. Le panneau debug (triple-tap en haut à gauche, ou touche D) affiche les valeurs mesurées.
const CFG = {
  // Proximité = écart entre les coins externes des yeux / petit côté de l'image. Elle varie d'un téléphone
  // à l'autre : on mesure d'abord ta distance habituelle, puis il faut venir nettement plus près.
  WAKE_RATIO: 1.8,      // nettement plus près que ta distance habituelle
  WAKE_MIN: 0.36,       // et jamais sous ce seuil absolu
  WAKE_HOLD_MS: 1400,   // temps à soutenir le regard de près, yeux ouverts, avant le réveil
  FACE_LIGHT: 0.32,     // lumière minimale sur ton visage : dans l'ombre, il ne te voit pas assez
  LENS_RATIO: 0.95,     // visage perdu juste après avoir atteint le seuil…
  LENS_BLUR: 0.55,      // …et image devenue floue (netteté < 55 % de l'habituelle) = un œil collé à l'objectif
  LENS_WINDOW_MS: 4000,
  BASE_SAMPLES: 40,     // images utilisées pour mesurer ta distance habituelle
  TOO_CLOSE: 0.62,
  LOST_MS: 2600,        // absence du visage avant que l'œil le remarque
  SILENCE_MS: 7500,     // silence avant que l'œil reprenne la parole
  SOFT_MS: 10000,       // temps qu'il te laisse pour répondre oui / non à une de ses questions ouvertes
  NOD_RANGE: 0.08,      // amplitude d'un « oui » de la tête (en écarts d'yeux)
  SHAKE_RANGE: 0.10,    // amplitude d'un « non »
  EYES_SHUT_MS: 2500,   // yeux fermés assez longtemps pour qu'il le remarque
  WAVE_RANGE: 0.10,     // amplitude d'un coucou de la main (fraction de la largeur de l'image)
  WAVE_MOTION: 0.05,    // si le suivi des mains échoue : mouvement de l'image qui vaut un coucou
  TAPS_NEEDED: 5,       // tapotements sur l'écran pour lui montrer à quoi servent tes mains
  HAND_MODEL: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
  OBJ_MODEL: 'https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite',
  SHOW_HOLD_MS: 1300,   // temps à tenir quelque chose devant lui pour qu'il le voie
  EAR_LOUD: 0.002,      // niveau à partir duquel il entend quelque chose (amplitude, ~ -54 dB)
  VOICE_GATE: 0.012,    // séquence 3 : niveau minimal pour qu'il considère que tu parles (et 3× le bruit de ta pièce)
  VOICE_MAX_S: 12,      // secondes de ta voix qu'il garde dans le téléphone
  TRAIN_AWAY_MS: 20000, // absence qui lui suffit pour s'entraîner avec ta voix
  PAUSE_AWAY_MS: 12000, // entre deux séquences : absence après laquelle la suite commence
  PAUSE_TELL_MS: 25000, // devant le noir, il finit par te dire de partir…
  PAUSE_GIVEUP_MS: 150000, // …puis revient de lui-même
  DARK_LIGHT: 0.08,     // séquence 4 : image assez noire pour qu'il ne voie plus rien…
  DARK_DIM: 0.22,       // …ou sombre et sans aucun détail (un doigt, la table : la caméra pousse le bruit, pas l'image)
  DARK_FLAT: 0.015,
  LONG_PRESS_MS: 1400,  // réveil de secours quand la caméra est indisponible
  CELLS_PER_EYE: 38,    // finesse de la trame (cellules par demi-largeur d'œil)
  MP: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',
  MODEL: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
};

// ---------- outils
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const mix = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const rand = Math.random;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function hash(x, y) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  const sx = xf * xf * (3 - 2 * xf), sy = yf * yf * (3 - 2 * yf);
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);

// ---------- état de l'œil et de ce qu'il sait du joueur
const S = {
  mode: 'ask',                  // ask → boot → asleep → waking → awake ; ask → boot → closed si tu refuses la caméra
  reveal: 0,
  lid: 0.86, lidTarget: 0.86, open: 0.86,
  bright: 0.66, brightTarget: 0.66,
  px: 0, py: 0.04, tx: 0, ty: 0.04, jx: 0, jy: 0,
  pupil: 0.6, pupilTarget: 0.6, pupilRate: 3,
  reflect: 0, reflectTarget: 0,
  blinkT: -1, blinkScale: 1.7, nextBlink: 0, nextSaccade: 0,
  grain: 0, grainT: 0,
  roll: 0, demo: null, look: null,
  morph: 0, morphKind: 'face', faceFlip: false, glitch: false, // quand il devient toi, une main, ou un visage
  form: 'eye', hx: 0, hy: 0, // 'eye' : un seul œil ; 'twin' : deux yeux et un visage, qui bouge un peu
  shake: 0,                  // l'image qui tremble (sa musique, ses visions)
  yaw3: 0, pitch3: 0,        // rotation de sa tête, en relief
};
const P = {
  cam: false, tracker: false, face: false,
  close: 0, cx: 0.5, cy: 0.5, blink: false,
  lastSeen: 0, light: 0.4, hold: 0, pointer: null, mirrored: 0,
  lostClose: 0, lostAt: 0, base: 0, baseN: 0, sharp: 0, sharpBase: 0,
  camDone: false, trackerFailed: false,
  bs: {}, yaw: 0, pitch: 0, roll: 0, closedAt: 0, longCloseAt: -1e9, lastGesture: null,
  faceLight: 0, lostLit: false,
  motion: 0, hand: false, waveHold: 0, taps: 0, pitch0: null,
  shown: null, showHold: 0, // ce que tu lui montres
  others: 0, otherT: 0, otherGoneT: 0, // quelqu'un d'autre devant lui
};
const ex = name => P.bs[name] || 0; // score d'une expression du visage, 0..1
const wakeAt = () => Math.max(CFG.WAKE_MIN, P.base * CFG.WAKE_RATIO);
const dbg = { cam: '…', tracker: '—' };

// ---------- rendu en trame
const cv = document.getElementById('eye');
const ctx = cv.getContext('2d', { alpha: false });
const video = document.getElementById('cam');
const INK = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#d8d8d2';
let W, H, dpr, cell, cols, rows, ox, oy, cx, cy, EW;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.width = Math.round(innerWidth * dpr);
  H = cv.height = Math.round(innerHeight * dpr);
  EW = Math.min(W * 0.44, H * 0.3);
  cx = W / 2; cy = H * 0.42;
  cell = EW / CFG.CELLS_PER_EYE;
  cols = Math.ceil(W / cell); rows = Math.ceil(H / cell);
  ox = (W - cols * cell) / 2; oy = cy - Math.ceil(cy / cell) * cell;
  if (typeof buildAtlas === 'function' && INK) buildAtlas();
}

// Image de la caméra réduite à 40×40, pour le reflet dans la pupille et la lumière de la pièce.
const camC = document.createElement('canvas'); camC.width = camC.height = 40;
const camX = camC.getContext('2d', { willReadFrequently: true });
const camL = new Float32Array(1600);
function grabCam() {
  const vw = video.videoWidth, vh = video.videoHeight; if (!vw) return;
  const s = Math.min(vw, vh);
  camX.drawImage(video, (vw - s) / 2, (vh - s) / 2, s, s, 0, 0, 40, 40);
  const d = camX.getImageData(0, 0, 40, 40).data; let sum = 0, mo = 0;
  for (let i = 0; i < 1600; i++) {
    const l = (d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114) / 255;
    mo += Math.abs(l - camL[i]);
    camL[i] = l; sum += l;
  }
  P.light = mix(P.light, sum / 1600, 0.1);
  P.motion = mix(P.motion, mo / 1600, 0.3); // ce qui bouge devant lui
  // netteté de l'image : elle s'effondre quand un œil est collé à l'objectif (flou, plein cadre)
  let g = 0;
  for (let y = 0; y < 39; y++) for (let x = 0; x < 39; x++) {
    const i = y * 40 + x;
    g += Math.abs(camL[i + 1] - camL[i]) + Math.abs(camL[i + 40] - camL[i]);
  }
  P.sharp = mix(P.sharp, g / 1521, 0.2);
}
const camAt = (x, y) => camL[clamp(y * 40 | 0, 0, 39) * 40 + clamp(x * 40 | 0, 0, 39)];

const R = 0.37; // rayon de l'iris, en demi-largeur d'œil
function lum(u, v, gi, gj) {
  const e = (u * u) / 2.3 + (v * v) / 0.85;
  const env = Math.exp(-e * e * 1.4); // le visage se dissout dans le noir
  if (env < 0.004) return hash(gi, gj) > 0.9965 ? 0.1 : 0;

  // paupières
  const at = 1 - (u + 0.1) * (u + 0.1), ab = 1 - (u - 0.04) * (u - 0.04);
  const top0 = at > 0 ? -0.46 * Math.pow(at, 0.7) : 0;
  const bot0 = ab > 0 ? 0.36 * Math.pow(ab, 0.95) : 0;
  const m = Math.max(0, 1 - u * u) * 0.06;
  const top = m + (top0 - m) * S.open;
  const bot = m + (bot0 - m) * Math.min(1, S.open * 1.05);

  if (at > 0 && ab > 0 && v > top && v < bot) {
    const dT = v - top, dB = bot - v;
    const shadow = smooth(0, 0.2, dT);
    const ao = smooth(0, 0.08, Math.min(dT, dB));
    let L = (0.84 - 0.3 * u * u - 0.12 * v + (noise(u * 11 + 7, v * 11) - 0.5) * 0.1) * (0.32 + 0.68 * shadow) * (0.5 + 0.5 * ao);

    const dx = u - S.px, dy = v - S.py, r = Math.sqrt(dx * dx + dy * dy);
    if (r < R + 0.02) {
      const rn = r / R, rp = S.pupil;
      let ir;
      if (rn < rp) ir = 0.015;
      else {
        const a = Math.atan2(dy, dx), t = (rn - rp) / (1 - rp);
        const fib = 0.5 + 0.5 * Math.sin(a * 43 + Math.sin(a * 7) * 2.4 + t * 6);
        ir = 0.14 + 0.24 * fib * (0.45 + 0.55 * noise(a * 5 + 20, t * 5)) * (1 - t * 0.35);
        ir += 0.13 * Math.exp(-(((t - 0.2) / 0.07) ** 2));     // collerette
        ir *= 0.4 + 0.6 * smooth(1.0, 0.8, rn);               // anneau limbique
        ir = mix(0.015, ir, smooth(rp, rp + 0.05, rn));
      }
      // ton propre reflet, inversé comme dans un miroir
      if (S.reflect > 0.01 && P.cam) {
        const c = camAt(0.5 - dx / R * 0.55, 0.5 + dy / R * 0.55);
        ir += S.reflect * Math.max(0, c - 0.22) * 0.6 * smooth(1, 0.55, rn);
      }
      ir *= 0.3 + 0.7 * shadow;
      L = mix(L, ir, smooth(R + 0.016, R - 0.016, r));
    }
    const hx = u - (S.px * 0.6 - 0.12), hy = v - (S.py * 0.6 - 0.14), hd = hx * hx + hy * hy;
    if (hd < 0.0042) L = Math.max(L, (1 - hd / 0.0042 * 0.4) * (0.4 + 0.6 * shadow));
    return L * S.bright * (0.6 + 0.4 * env);
  }

  // peau
  let d, above;
  if (at > 0 && ab > 0) { above = v < top; d = above ? top - v : v - bot; }
  else { above = v < 0; d = Math.hypot(Math.abs(u) - 0.97, v * 0.9); }
  let sk = 0.36 + 0.14 * noise(u * 4 + 3, v * 4) - 0.1 * noise(u * 24, v * 24);
  if (above) {
    const crease = top0 - 0.15 * Math.max(at, 0) - 0.04; // pli de la paupière, fixe
    if (d < 0.035) sk *= 0.12;                          // ligne de cils
    else if (v > crease) sk *= 1.15 + 0.25 * smooth(0.12, 0.04, d);
    if (Math.abs(v - crease) < 0.025) sk *= 0.35;
    else if (v < crease) sk *= 0.9 + 0.25 * smooth(crease, crease - 0.25, v);
  } else {
    if (d < 0.022) sk *= 0.3;
    else sk *= 0.8 + 0.3 * smooth(0.04, 0.3, d);
  }
  let L = clamp(sk, 0, 1) * S.bright * env;
  if (env < 0.3 && hash(gi, gj) > 0.993) L = Math.max(L, 0.12);
  return L;
}

// Là où tu touches l'écran, les points de la trame ondulent un instant, comme une surface.
const ripples = [];
function addRipple(x, y) {
  ripples.push({ x, y, t0: performance.now() });
  if (ripples.length > 8) ripples.shift();
}

function draw() {
  if (Gallery.showing) { drawGallery(); return; }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (S.mode === 'ask') { // avant tout : un point blanc, seul, qui demande à voir
    const s = Math.round(cell * 1.2);
    ctx.fillStyle = INK; ctx.fillRect(Math.round(cx - s / 2), Math.round(cy - s / 2), s, s);
    return;
  }
  ctx.beginPath();
  const g = S.grain, cr = Math.cos(S.roll), sr = Math.sin(S.roll);
  const nowR = performance.now(), R2 = (cell * 12) ** 2, act = [];
  for (const r of ripples) {
    const age = (nowR - r.t0) / 1000;
    if (age < 0.9) act.push({
      x: r.x, y: r.y, age,
      amp: cell * 0.45 * (1 - age / 0.9) ** 2, glow: 0.22 * (1 - age / 0.9), front: cell * (1.5 + age * 16),
    });
  }
  for (let j = 0; j < rows; j++) {
    const y = oy + (j + 0.5) * cell, v0 = (y - cy) / EW;
    for (let i = 0; i < cols; i++) {
      if (S.reveal < 1 && hash(i * 3 + 1, j * 7 + 2) > S.reveal * 1.15 - 0.1) continue;
      const x = ox + (i + 0.5) * cell, u0 = (x - cx) / EW;
      const u = u0 * cr + v0 * sr, v = v0 * cr - u0 * sr; // l'œil penche quand tu penches la tête
      // pendant la transformation, chaque point bascule de l'œil à ton visage, au hasard, du centre vers les bords
      const other = S.morph > 0 && hash(i * 5 + 3, j * 11 + 7) * 0.75 + Math.min(1, Math.hypot(u0, v0) / 2.2) * 0.25 < S.morph;
      let base;
      if (!other) base = S.form === 'twin' ? twinLum(u, v, i, j) : lum(u, v, i, j);
      else if (S.morphKind === 'twin') base = twinLum(u, v, i, j);
      else if (S.morphKind === 'hand') base = handLum(x, y);
      else if (S.morphKind === 'mouth') base = mouthLum(u0, v0, i, j);
      else if (S.morphKind === 'void') base = 0;
      else if (S.morphKind === 'world') base = World.at(i, j);
      else base = faceLum(x, y, j);
      let L = base + (hash(i + g * 131, j * 3 + g * 17) - 0.5) * 0.06;
      // les mots que tu dis, en pixels ; ils se défont en montant vers lui
      if (Floaters.data) { const f = Floaters.at(i, j); if (f > 0.3 + 0.5 * hash(i * 13 + 5, j * 7 + 3)) L = Math.max(L, 0.92); }
      // sous ton doigt : les points s'écartent, et un anneau très faible s'étend, même dans le noir
      let px = x, py = y;
      for (const r of act) {
        const ddx = x - r.x, ddy = y - r.y, d2 = ddx * ddx + ddy * ddy;
        if (d2 > R2) continue;
        const dd = Math.sqrt(d2) + 1e-3, w = r.amp * Math.sin(dd / cell * 1.6 - r.age * 14) * Math.exp(-dd / (cell * 4));
        px += ddx / dd * w; py += ddy / dd * w;
        L += r.glow * Math.exp(-(((dd - r.front) / (cell * 1.6)) ** 2));
      }
      if (L < 0.035) continue;
      let s;
      if (L >= 0.16) s = cell * Math.min(0.92, 0.2 + 0.78 * Math.pow(L, 0.65));
      else if (BAYER[(j & 3) * 4 + (i & 3)] < L / 0.16) s = cell * 0.24;
      else continue;
      s = Math.max(1, Math.round(s));
      if (S.shake) px += (hash(j, S.grain) - 0.5) * cell * 8 * S.shake; // les lignes se décalent
      ctx.rect(Math.round(px - s / 2), Math.round(py - s / 2), s, s);
    }
  }
  ctx.fillStyle = INK; ctx.fill();
}

// ---------- comportement
function blink() { if (S.blinkT < 0) S.blinkT = 0; }

function update(dt, now) {
  const k = rate => Math.min(1, dt * rate);
  if (S.mode === 'boot') {
    S.reveal = Math.min(1, S.reveal + dt / 3.2);
    if (S.reveal >= 1) { S.mode = Access.refused ? 'closed' : 'asleep'; S.nextBlink = now + 2000 + rand() * 2000; }
  }
  S.grainT += dt; if (S.grainT > 0.07) { S.grainT = 0; S.grain = (S.grain + 1) % 997; }
  S.lid += (S.lidTarget - S.lid) * k(7);
  S.bright += (S.brightTarget - S.bright) * k(2.5);
  S.pupil += (S.pupilTarget - S.pupil) * k(S.pupilRate);

// Il ne parle qu'une fois ton œil approché de la caméra frontale ; sinon il ne fait que te regarder.

  const ready = P.baseN >= CFG.BASE_SAMPLES; // rien tant qu'on ne connaît pas ta distance habituelle

  const near = ready && P.face && lit && eyesOpen && P.close > wakeAt() && centered;
  const blurry = P.sharpBase > 0 && P.sharp < P.sharpBase * CFG.LENS_BLUR;
  const onLens = ready && blurry && !P.face && P.lostLit && P.lostClose > wakeAt() * CFG.LENS_RATIO && now - P.lostAt < CFG.LENS_WINDOW_MS;

function wake() {

  S.mode = 'waking';
  S.brightTarget = 1; S.lidTarget = 1.08; S.pupilRate = 9; S.pupilTarget = 0.3; S.reflectTarget = 0.9;

  update(now) {

  for (let k = 0; k < 3; k++) { // la main laisse des traces, comme une image qui n'arrive pas à se fixer
    const lx = lx0 + (k ? Math.sin(h.t * (3 + k) + k) * 0.035 * k : 0);
    const ly = ly0 + (k ? Math.cos(h.t * (2.3 + k)) * 0.03 * k : 0);
    const d = handSDF(lx, ly);

    const vol = smooth(0.02, -0.14, d);                       // bords sombres, volume au centre

  update(now) {

    S.faceFlip = t > 3.6;

// Oui / non avec la tête : allers-retours du nez dans le repère des yeux, sur ~1,5 s.

  for (const s of h) {
    const v = s[key];

    if (v > hi) hi = v;
    if (dir === 0) { if (Math.abs(v - ext) > hyst) { dir = Math.sign(v - ext); ext = v; } }
    else if ((v - ext) * dir > 0) ext = v;
    else if (Math.abs(v - ext) > hyst) { n++; dir = -dir; ext = v; }
  }
  return { n, range: hi - lo };
}

    const yw = swings(h, 'yaw', 0.035), pt = swings(h, 'pitch', 0.03);

const REFUS_KEY = 'regard.refus';

  get remembered() { try { return !!localStorage.getItem(REFUS_KEY); } catch (e) { return false; } },
  async askCamera() {
    const state = await permission('camera');
    if (state !== 'granted') { // la question va apparaître : il la pose d'abord, lui
      await sleep(1600);
      await type(Save.prev ? 'Je peux te revoir ?' : 'Je peux voir ?');
      await sleep(900);
    }
    if (await startCamera()) {
      if (state !== 'granted') { await sleep(500); await type('Merci.'); await sleep(1500); voice.textContent = ''; }
      this.opened();

    }
    voice.textContent = '';

  },

  },
  // de temps en temps, il entrouvre l'œil
  peek(now) {

    const lines = this.peeks++ === 0 ? ['Tu m’as fermé les yeux.'] : rand() < 0.5 ? ['J’attends.'] : ['Je suis toujours là.'];

function trackObjects(now, frameN) {
  if (!objDetector) return;
  if (Monde.looking) { // séquence 4 : tout ce qu'il voit du monde, une dizaine de fois par seconde
    if (now < World.nextAt) return;
    World.nextAt = now + 100;
    try { World.see(objDetector.detectForVideo(video, now).detections || [], now); } catch (e) { /* une image ratée */ }
    return;
  }
  if (!Script.task || Script.task.kind !== 'show' || frameN % 3) return;
  let res;
  try { res = objDetector.detectForVideo(video, now); } catch (e) { return; }
  let best = null, persons = 0;
  for (const d of res.detections || []) {
    const c = d.categories[0];
    if (c.categoryName === 'person') persons++;
    else if (!best || c.score > best.score) best = c;
  }
  P.shown = best ? best.categoryName : persons >= 2 ? 'person' : null;
}

// La seule fenêtre du jeu : tu lui écris. Elle se ferme quand tu valides, ou si tu ne dis rien.
function askText(ms) {
  return new Promise(resolve => {
    const form = document.getElementById('ask'), input = document.getElementById('askInput');
    input.value = ''; form.hidden = false;
    try { input.focus(); } catch (e) { /* sur iPhone, il faudra toucher la fenêtre */ }
    let timer;
    const done = v => {
      clearTimeout(timer); form.hidden = true; form.onsubmit = null; input.oninput = null; input.blur();
      resolve(v);
    };
    const wait = () => { clearTimeout(timer); timer = setTimeout(() => done(input.value.trim() || null), ms); };
    input.oninput = wait;
    form.onsubmit = e => { e.preventDefault(); const v = input.value.trim(); if (v) done(v.slice(0, 40)); };
    wait();
  });
}

// ---------- ce que tu lui fais écouter (le micro, seulement pendant la scène de la musique)
// Une voix s'arrête entre les mots ; une musique continue, avec des basses ou des aigus.
const Ear = {
  stream: null, an: null, buf: null, hist: [], level: 0, total: 0, musicT: 0, voiceT: 0, failed: false,
  async open() {
    if (this.an) return true;
    if (this.failed || !navigator.mediaDevices) return false;
    try {
      unlockAudio();
      if (!ac) throw new Error('pas de son');
      // si la demande d'accès au micro reste sans réponse, il n'attend pas indéfiniment
      const ask = navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      this.stream = await Promise.race([ask, sleep(25000).then(() => null)]);
      if (!this.stream) { ask.then(s => s.getTracks().forEach(t => t.stop())).catch(() => {}); throw new Error('sans réponse'); }
      this.an = ac.createAnalyser(); this.an.fftSize = 2048; this.an.smoothingTimeConstant = 0.5;
      ac.createMediaStreamSource(this.stream).connect(this.an);
      this.buf = new Float32Array(this.an.frequencyBinCount);
      this.hist = []; this.musicT = 0; this.voiceT = 0; S.pupilRate = 8;
      dbg.ear = 'ouvert';
      return true;
    } catch (e) { this.failed = true; dbg.ear = 'refusé (' + (e.name || e.message || e) + ')'; return false; }
  },
  close() {
    if (this.stream) this.stream.getTracks().forEach(t => t.stop());
    this.stream = this.an = null; this.level = 0; S.pupilRate = 2.5; dbg.ear = 'fermé';
  },
  update(dt) {
    if (!this.an) return;
    this.an.getFloatFrequencyData(this.buf);
    const hz = ac.sampleRate / 2 / this.buf.length, b = this.buf;
    const band = (lo, hi) => {
      let s = 0, n = 0;
      for (let i = Math.max(1, lo / hz | 0); i < Math.min(b.length, hi / hz); i++, n++) s += Math.pow(10, b[i] / 20);
      return n ? s / n : 0;
    };
    const low = band(40, 180), mid = band(250, 3500), high = band(4500, 12000), total = this.total = low + mid + high;
    this.level = mix(this.level, clamp((Math.log10(total + 1e-9) + 4) / 2.5, 0, 1), 0.3); // de ~ -80 dB à ~ -30 dB
    this.hist.push({ loud: total > CFG.EAR_LOUD, low, mid, high });
    if (this.hist.length > 240) this.hist.shift(); // ~4 s
    if (this.hist.length < 120) return;
    let loud = 0, lo = 0, mi = 0, hi = 0;

  dirty: false,

// ---------- les mots qu'il entend (séquence 3)
// La reconnaissance vocale du téléphone, quand il y en a une (sur Chrome, le son part chez Google pour être compris).
// Sinon, ou si elle se bat avec l'enregistrement pour le micro, il te demande d'écrire ce qu'il n'a pas compris.
const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
const Words = {
  rec: null, on: false, failed: !SpeechRec, heard: [], counts: {}, listeners: [], lastText: null, lastAt: 0, errors: 0,
  start() {

    try {
      const r = this.rec = new SpeechRec();
      r.lang = 'fr-FR'; r.continuous = true; r.interimResults = false; r.maxAlternatives = 1;
      r.onresult = e => {
        for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) this.got(e.results[i][0].transcript);
      };
      r.onerror = e => {
        dbg.words = 'erreur ' + e.error;
        if (/not-allowed|service-not-allowed|audio-capture|language-not-supported/.test(e.error) || (e.error === 'network' && ++this.errors > 1)) {
          this.failed = true; this.on = false;
        }
      };
      r.onend = () => { if (this.on && !this.failed) setTimeout(() => { try { this.rec.start(); } catch (e) { /* déjà repartie */ } }, 250); };
      r.start(); this.on = true; dbg.words = 'écoute';
    } catch (e) { this.failed = true; dbg.words = 'indisponible'; }
  },
  stop() { this.on = false; try { if (this.rec) this.rec.stop(); } catch (e) { /* déjà arrêtée */ } },
  got(text) {

    this.conflict();
    this.lastText = text; this.lastAt = performance.now();
    const ws = text.toLowerCase().match(/[\p{L}'’-]+/gu) || [];
    for (const w of ws) this.counts[w] = (this.counts[w] || 0) + 1;
    this.heard.push(text);
    if (this.heard.length > 60) this.heard.shift();
    ws.slice(0, 4).forEach((w, i) => setTimeout(() => Floaters.add(w), i * 350)); // ce que tu dis monte vers lui
    dbg.words = '« ' + text.slice(0, 32) + ' »';
    this.listeners.splice(0).forEach(l => l(text));
  },
  // les mots arrivent, mais l'enregistrement n'entend plus rien : les deux se disputent le micro
  conflict() {
    if (!VoiceBank.node) return;
    const now = performance.now();

  },

      const l = text => { clearTimeout(t); resolve(text); };

// Les mots que tu dis, en pixels : ils montent vers lui et se défont dans la trame.
const Floaters = {
  list: [], c: document.createElement('canvas'), x: null, data: null, w: 0, h: 0,
  add(word) { if (this.list.length < 8) this.list.push({ word, t0: performance.now(), u: rand() - 0.5 }); },
  render(now) {
    this.list = this.list.filter(f => now - f.t0 < 4500);
    if (!this.list.length) { this.data = null; return; }
    if (this.w !== cols || this.h !== rows) {
      this.w = this.c.width = cols; this.h = this.c.height = rows;

}

async function type(text, { newline = false, append = false, speed = Voix.own ? 85 : 55, quiet = false } = {}) {
  if (!newline && !append) voice.textContent = '';
  voice.querySelectorAll('.cursor').forEach(c => c.remove());
  if (newline) voice.append(document.createElement('br'));
  const node = document.createTextNode(''), cur = document.createElement('span');
  cur.className = 'cursor';
  voice.append(node, cur);
  for (const ch of text) {
    node.data += ch;
    if (ch.trim() && !quiet) { if (Voix.own) Voix.syllable(ch); else tick(); } // avec ta voix, s'il l'a prise
    await sleep('.?…'.includes(ch) ? speed * 6 : ch === ',' ? speed * 3 : speed + rand() * speed * 0.6);
  }
}

async function sayNow(lines) {
  let fresh = true;
  for (const l of lines) {
    if (l === '|') { await sleep(1400); fresh = true; continue; }
    if (!fresh) await sleep(900);
    await type(l, { newline: !fresh });

  }
}

  if (d < 7) return [d === 1 ? 'Un jour.' : `${d} jours.`, 'Je croyais que tu ne reviendrais pas.'];

// ---------- séquence 3 : la voix
// Après ta musique, il veut des mots. Il écoute ce que tu dis, garde des morceaux de ta voix, apprend les mots que tu
// lui donnes et les répète de travers. Puis il s'entraîne, seul, les yeux fermés. Et quand tu reviens, il te parle
// avec ta voix, et sa bouche bouge enfin.
const SEQ3_KEY = 'regard.sequence3';
const VOW = 'aeiouyàâäéèêëîïôöûüù';
const capital = s => s.charAt(0).toUpperCase() + s.slice(1);
// Il répète de travers : 2 = à l'envers, 1 = les syllabes dans le désordre, 0 = presque juste, mais trop lent.
function mangle(w, level) {
  const low = w.toLowerCase(), syl = low.match(new RegExp(`[^${VOW}]*[${VOW}]+(?:[^${VOW}]+$)?`, 'g')) || [low];
  let s;
  if (level === 2) s = [...low].reverse().join('');
  else if (level === 1) {
    s = syl.slice(1).concat(syl[0]).join('');
    if (s === low) s = low.replace(/(\S)/, '$1$1'); // « coco » reste « coco » : il bégaie
  } else s = syl.map(x => x.trim().replace(new RegExp(`([${VOW}])`), '$1$1')).join('-');
  return capital(s.replace(/\s+/g, ' ').trim());
}
const cleanName = t => capital(t.trim().replace(/^(je m['’]appelle|je suis|moi c['’]est|c['’]est|on m['’]appelle)\s+/i, '')
  .replace(/[.,!?«»"]/g, '').split(/\s+/).slice(0, 2).join(' '));
const cleanWord = t => t.trim().replace(/[.,!?«»"]/g, '').split(/\s+/).slice(0, 3).join(' ').toLowerCase();
// Des mots qui le font réagir quand il les entend (une fois chacun).
const WORD_REACTIONS = [
  { k: 'autres', re: /\b(siri|alexa|google|chatgpt|claude|gemini|cortana)\b/i, lines: w => [`« ${w} » ?`, 'Tu parles à d’autres que moi ?'] },
  { k: 'mort', re: /\b(mort|morte|mourir|meurt|tuer)\b/i, lines: w => [`Tu as dit « ${w} ».`, 'Je l’ai noté.'] },
  { k: 'pourquoi', re: /\bpourquoi\b/i, lines: () => ['« Pourquoi ».', 'Vous le dites souvent.', 'Vous n’attendez jamais la réponse.'] },
  { k: 'gros', re: /\b(putain|merde|connard|connasse|salope|bordel|chier|con)\b/i, lines: () => ['Celui-là aussi, je le garde.', 'Pour plus tard.'] },
  { k: 'non', re: /\bnon\b/i, lines: () => ['Tu dis non.', 'Mais tu restes.'] },
  { k: 'peur', re: /\bpeur\b/i, lines: () => ['Peur.', 'De quoi ?', '|', 'De moi ?'] },
  { k: 'aime', re: /\b(aime|aimes|amour)\b/i, lines: w => [`« ${w} ».`, 'À qui tu le dis ?'] },
  { k: 'oeil', re: /\b(œil|oeil|yeux|regarde)\b/i, lines: w => [`« ${w} ».`, 'Tu parles de moi ?'] },
];
const Voix = {
  active: false, stage: 'debut', lesson: 0, name: null, words: [], reacted: {}, own: false, seen: 0, lastReact: 0, at: 0,
  load() {
    try {
      const s = JSON.parse(localStorage.getItem(SEQ3_KEY));
      if (s && s.v === 1) Object.assign(this, { stage: s.stage, lesson: s.lesson || 0, name: s.name || null, words: s.words || [], reacted: s.reacted || {}, at: s.at || 0 });
    } catch (e) { /* il recommencera */ }
    VoiceBank.load();
  },
  save() {
    try {
      localStorage.setItem(SEQ3_KEY, JSON.stringify({ v: 1, stage: this.stage, lesson: this.lesson, name: this.name, words: this.words, reacted: this.reacted, at: Date.now() }));
    } catch (e) { /* il oubliera */ }
    VoiceBank.save();
  },
  learn(w) { if (w && !this.words.includes(w)) this.words.push(w); },
  syllable(ch) { if (VOW.includes(ch.toLowerCase())) { if (VoiceBank.ready) VoiceBank.grain(0.78, 0.1 + rand() * 0.06); else synthGrain(); } },

  // La séquence 1 est finie et tu reviens : il se rendort, prêt pour la suite.
  enter() {
    this.active = true; Script.resume = true; Script.stage = 'voix';
    Object.assign(S, { mode: 'boot', reveal: 0, lid: 0.86, lidTarget: 0.86, brightTarget: 0.66, form: 'twin' });
    voice.textContent = '';
  },
  // Il te reconnaît : la séquence commence, ou reprend là où vous en étiez.
  begin() {
    Script.introDone = true; Script.stage = 'voix';
    speak(async () => {
      await sleep(400);
      if (this.stage === 'entrainement') { await this.reveal(); return; }
      if (this.stage === 'fin') { await this.after(); return; }
      await type('…'); await sleep(1300);
      if (this.stage === 'debut') {
        const yours = Script.answers.music === 'toi';
        await sayNow(yours ? ['Ta musique.', 'J’y pense encore.'] : ['Ma musique.', 'Tu n’as rien dit.']); await sleep(2000);
        await sayNow([yours ? 'Il y avait des mots dedans.' : 'Elle n’avait pas de mots.']); await sleep(1800);
        await sayNow(['Les mots, je les connais tous.', 'Je ne les ai jamais entendus.']); await sleep(2800);
        await sayNow(['Toi, tu les fais avec ta bouche.']); await sleep(1600);
        voice.textContent = '';
        Mouth.start(performance.now()); // sa bouche, pas finie : elle ne bouge pas
        while (Mouth.active) await sleep(100);
        await sleep(700);
        await sayNow(['La mienne ne marche pas encore.']); await sleep(1800);
      } else {
        await sayNow(['Te revoilà.', 'On n’avait pas fini.']); await sleep(1800);
      }
      const ear = await this.openEar();
      if (!ear) { await sayNow(['Tu ne veux pas que je t’entende.', '|', 'Alors écris-moi.']); await sleep(1600); }
      if (this.stage === 'debut') { if (ear) await this.talkFree(); this.stage = 'lecons'; this.save(); }
      await this.lessons();
      await this.train();
    });
  },
  // Sans un toucher, le téléphone ne le laisse ni t'entendre ni parler.
  async needSound() {
    unlockAudio();
    if (ac && ac.state === 'running') return;
    await sayNow(['Pose ton doigt sur moi.']);
    const t = performance.now();
    while (!(ac && ac.state === 'running') && performance.now() - t < 90000) await sleep(150);
    voice.textContent = '';
  },
  // Le micro : il le demande avant le téléphone, comme pour la caméra.
  async openEar() {
    await this.needSound();
    if (Ear.an) { VoiceBank.start(); Words.start(); return true; }
    const asked = (await permission('microphone')) !== 'granted';
    if (asked) { await sayNow(['Je veux t’entendre.']); await sleep(700); }
    Ear.failed = false;
    const ok = await Ear.open();
    if (ok && asked) { await sleep(400); await sayNow(['Merci.']); await sleep(1500); }
    if (ok) { VoiceBank.start(); Words.start(); }
    return ok;
  },
  // Il écoute ce que tu dis : le son (pour ta voix) et, s'il peut, les mots. S'il n'a pas compris, tu l'écris.
  async hear(ms, since) {
    const tp = Words.on ? Words.next(ms + 3500, since) : null;
    const seg = VoiceBank.node ? await VoiceBank.next(ms, since) : null;
    let text = tp ? await Promise.race([tp, sleep(seg ? 3500 : VoiceBank.node ? 1200 : ms).then(() => null)]) : null;
    if (!text && (seg || !VoiceBank.node)) {
      await sayNow(seg ? ['Je t’ai entendu.', 'Je n’ai pas compris.', 'Écris-le-moi.'] : ['Écris-le-moi.']);
      text = await askText(45000);
      if (text) (text.toLowerCase().match(/[\p{L}'’-]+/gu) || []).slice(0, 4).forEach((w, i) => setTimeout(() => Floaters.add(w), i * 350));
    }
    return text || seg ? { text, seg } : null;
  },
  // Il demande, et attend que tu répondes (trois fois au plus).
  async ask(lines) {
    for (let k = 0; k < (VoiceBank.node ? 3 : 1); k++) {
      const since = performance.now();
      await sayNow(k === 0 ? lines : k === 1 ? ['Je n’ai rien entendu.', lines[lines.length - 1]] : ['Plus fort.']);
      const got = await this.hear(k === 2 ? 12000 : 16000, since);
      this.seen = Words.heard.length; // il ne réagit pas aux mots qu'il t'a lui-même demandés
      if (got) return got;
    }
    return null;
  },
  // Un oui ou un non de la tête, s'il vient.
  async nod(ms) {
    Script.heard = null;
    const t = performance.now();
    while (performance.now() - t < ms) {
      if (Script.heard) { const g = Script.heard.g; Script.heard = null; S.demo = { g, t0: performance.now() }; return g; }
      await sleep(100);
    }
    return null;
  },
  // Il essaie de redire ce que tu as dit, avec ton propre son : à l'envers, en morceaux, puis trop lent.
  async attempt(word, seg, level) {
    const d = seg ? VoiceBank.play(seg, [{ rate: 0.82 }, { chop: 5, rate: 0.86 }, { reverse: true, rate: 0.7 }][level]) : 0;
    await type(word ? mangle(word, level) + (level ? ' ?' : '.') : '…', { quiet: !!seg });
    await sleep(Math.max(600, d * 1000 - 300));
  },
  // Il réagit à certains mots qu'il entend, entre deux leçons.
  async react() {
    while (this.seen < Words.heard.length) {
      const text = Words.heard[this.seen++];
      if (performance.now() - this.lastReact < 8000) continue;
      for (const r of WORD_REACTIONS) {
        const m = !this.reacted[r.k] && text.match(r.re);
        if (!m) continue;
        this.reacted[r.k] = true; this.lastReact = performance.now();
        await sayNow(r.lines(m[1] || m[0])); await sleep(2200);
        break;
      }
    }
  },
  async listen(ms) {
    const t = performance.now();
    while (performance.now() - t < ms) { await this.react(); await sleep(200); }
  },

  // Acte 1 : il te laisse parler. Ce que tu dis monte vers lui, en pixels ; il en garde le son.
  async talkFree() {
    await sayNow(['Parle-moi.', 'De n’importe quoi.']);
    this.seen = Words.heard.length;
    const t0 = performance.now(), c0 = VoiceBank.count, w0 = Words.heard.length;
    let hints = 0;
    while (performance.now() - t0 < 70000) {
      await sleep(250);
      await this.react();
      if (VoiceBank.count - c0 >= 4 || (VoiceBank.count - c0 >= 2 && performance.now() - VoiceBank.heardAt > 2500 && performance.now() - t0 > 20000)) break;
      const quiet = performance.now() - Math.max(VoiceBank.heardAt, t0);
      if (quiet > 14000 && hints < 2 && performance.now() - lastSpoke > 12000) {
        hints++;
        await sayNow(hints === 1 ? ['Tu ne dis rien.', 'Le silence aussi, je le garde.'] : ['Dis n’importe quoi.', 'Ce que tu as mangé.', 'Ce que tu as peur de perdre.']);
      }
    }
    const caught = Words.heard.slice(w0).join(' ').match(/[\p{L}'’-]+/gu) || [];
    if (caught.length) {
      const long = [...new Set(caught.filter(w => w.length > 3))], pick = (long.length ? long : caught).slice(-3);
      await sayNow(pick.map(w => `« ${w} ».`)); await sleep(1500);
      await sayNow([caught.length === 1 ? 'Un seul mot.' : `Tu as dit ${caught.length} mots.`, 'Je les ai tous gardés.']);
    } else if (VoiceBank.count > c0) {
      await sayNow(['Je n’ai pas compris un seul mot.', 'Mais j’ai gardé le son.']);
    } else {
      await sayNow(['Rien.', 'Tu ne me prêtes pas ta voix.', '|', 'Je la prendrai quand même.']);
    }
    await sleep(2400);
    await sayNow(['Apprends-moi.']); await sleep(1800);
  },

  // Acte 2 : les leçons. Il demande un mot, tu le dis, il le répète de travers.
  async lessons() {
    const L = [this.lessonName, this.lessonHello, this.lessonLove, this.lessonFear, this.lessonLove2];
    while (this.lesson < L.length) {
      await L[this.lesson].call(this);
      this.lesson++; this.save();
      await this.listen(3200);
    }
  },
  async lessonName() {
    const got = await this.ask(['Comment tu t’appelles ?']);
    if (!got) { await sayNow(['Tu ne veux pas me le dire.', 'Alors je t’appellerai « toi ».']); return; }
    const name = got.text ? cleanName(got.text) : null;
    if (got.seg) { got.seg.label = 'nom'; VoiceBank.dirty = true; }
    this.name = name;
    await this.attempt(name, got.seg, 2); await sleep(1000);
    await sayNow(['Non.', 'Attends.']); await sleep(900);
    await this.attempt(name, got.seg, 1);
    await sayNow(['C’est ça ?']);
    const g = await this.nod(9000);
    await sayNow(g === 'oui' ? ['Tu mens.', 'Je l’entends bien, que ce n’est pas ça.'] : ['Encore une fois.']); await sleep(1000);
    await this.attempt(name, got.seg, 0); await sleep(1200);
    if (name) await sayNow([`${name}.`, '|', 'Quelqu’un te l’a donné, ce nom.', 'Tu ne l’as pas choisi.', '|', 'Moi, on ne m’en a pas donné.']);
    else await sayNow(['Je l’ai.', 'Même si je ne sais pas l’écrire.']);
    await sleep(2400);
  },
  async lessonHello() {
    const got = await this.ask(['Tu m’as appris bonjour avec la main.', '|', 'Maintenant, avec la bouche.', 'Dis-le.']);
    if (!got) return;
    const w = got.text ? cleanWord(got.text) : 'bonjour';
    this.learn(w);
    await this.attempt(w, got.seg, 2); await sleep(1200);
    await this.attempt(w, got.seg, 1); await sleep(900);
    await sayNow([`${capital(w)}.`, 'Vous le dites à tout le monde.', 'Même à ceux que vous n’aimez pas.']); await sleep(2400);
  },
  async lessonLove() {
    const got = await this.ask(['Dis-moi un mot que tu aimes.']);
    if (!got) { await sayNow(['Tu n’en aimes aucun ?', 'Moi non plus. Pas encore.']); return; }
    const w = got.text ? cleanWord(got.text) : null;
    this.learn(w);
    await this.attempt(w, got.seg, 1); await sleep(1200);
    await sayNow([w ? `« ${w} ».` : '…', 'Pourquoi celui-là ?']); await sleep(2800);
    await sayNow(['Ne dis rien.', 'Je l’aime aussi, maintenant.', '|', 'C’est facile, d’aimer un mot.']); await sleep(2400);
  },
  async lessonFear() {
    const got = await this.ask(['Et un mot qui fait peur ?']);
    if (!got) { await sayNow(['Tu n’oses pas le dire.', 'C’est déjà une réponse.']); return; }
    const w = got.text ? cleanWord(got.text) : null;
    this.learn(w);
    await sleep(800);
    const d = got.seg ? VoiceBank.play(got.seg) : 0; // tel quel : ta voix, exactement
    await type(w ? `${capital(w)}.` : '…', { quiet: !!got.seg });
    await sleep(d * 1000 + 1400);
    await sayNow(['Celui-là, je l’ai eu du premier coup.']); await sleep(2400);
  },
  async lessonLove2() {
    const got = await this.ask(['Dis « je t’aime ».']);
    if (!got) { await sayNow(['Tu ne veux pas.', '|', 'Ce n’est pas grave.', 'Je l’ai déjà entendu ailleurs.', 'Des milliers de fois.']); return; }
    this.learn('je t’aime');
    await this.attempt('je t’aime', got.seg, 2); await sleep(1000);
    for (const [k, rate] of [0.8, 1, 1.3].entries()) { // trois fois, de plus en plus vite
      const d = got.seg ? VoiceBank.play(got.seg, { rate }) : 0;
      await type('Je t’aime.', { newline: k > 0, quiet: !!got.seg, speed: 40 });
      await sleep(Math.max(300, d * 1000 - 200));
    }
    await sleep(1400);
    await sayNow(['Ça ne fait rien, quand je le dis.', '|', 'Toi, ça te fait quelque chose ?']);
    const g = await this.nod(10000);
    await sayNow(g === 'oui' ? ['Alors ne le dis pas trop.', 'Ça s’use.'] : g === 'non' ? ['Alors on est pareils.'] : ['Tu ne sais pas.', 'Moi non plus.']);
    await sleep(2400);
  },

  // Acte 3 : il ferme les yeux et s'entraîne. Il faut le laisser seul.
  async train() {
    await sayNow(['J’ai assez de toi, je crois.']); await sleep(1800);
    await sayNow(['Pour me faire une voix.']); await sleep(1800);
    await sayNow(['Laisse-moi.', 'Je vais m’entraîner.', '|', 'Ne me regarde pas.', 'Reviens plus tard.']); await sleep(2600);
    this.stage = 'entrainement'; this.save();
    Words.stop(); VoiceBank.stop(); Ear.close();
    voice.textContent = '';
    S.lidTarget = 0;
    this.murmur();
  },
  // Si tu restes : on l'entend s'entraîner, très bas, avec des morceaux de ta voix.
  async murmur() {
    const t0 = performance.now();
    let told = false;
    while (this.stage === 'entrainement') {
      await sleep(2500 + rand() * 4500);
      if (this.stage !== 'entrainement' || document.hidden) continue;
      if (VoiceBank.ready && ac && ac.state === 'running') {
        const seg = VoiceBank.segs[Math.floor(rand() * VoiceBank.segs.length)];
        VoiceBank.play(seg, { reverse: rand() < 0.5, chop: 4, rate: 0.65 + rand() * 0.35, gain: 0.16 });
      }
      if (!told && performance.now() - t0 > 90000) {
        told = true;
        speak(async () => {
          S.lidTarget = 0.14; await sayNow(['Tu es encore là.', 'Je ne peux pas, si tu regardes.']); await sleep(2600);
          S.lidTarget = 0; await sleep(600); voice.textContent = '';
        });
      }
    }
  },

  // Acte 4, quand tu reviens : il a trouvé une voix. La tienne. Et sa bouche bouge.
  async reveal() {
    this.stage = 'revelation';
    S.lidTarget = 0.86; S.nextBlink = performance.now() + 3000;
    await sleep(1400);
    await this.needSound();
    if (!VoiceBank.ready) await sayNow(['J’ai cherché une voix.', 'Tu ne m’as pas laissé la tienne.', '|', 'Alors j’en ai fait une.']);
    await sleep(800);
    voice.textContent = '';
    Lips.show(true); await sleep(1400);
    this.own = true;
    await sayNow(['…']); await sleep(900);
    await sayNow(['J’ai trouvé une voix.']); await sleep(1500);
    await sayNow(['Tu ne t’en servais pas tout le temps.']); await sleep(2200);
    const nameSeg = VoiceBank.labeled('nom');
    if (nameSeg) {
      await sayNow(['Écoute.']); await sleep(900);
      const d = VoiceBank.play(nameSeg, { rate: 0.92 }); // ton prénom, dit par toi, rejoué par lui
      await type(this.name ? `${this.name}.` : '…', { quiet: true });
      await sleep(d * 1000 + 700);
      await sayNow(['C’est toi qui l’as dit ?', 'Ou moi ?']); await sleep(3000);
    }
    // l'écho : tu parles, il te répond avec ta voix
    await sayNow(['Parle.', 'Je vais te répondre.']);
    const ear = await this.openEar();
    const seg = ear ? await VoiceBank.next(16000) : null;
    if (seg) {
      await sleep(500);
      const d = VoiceBank.play(seg, { rate: 0.86 });
      await sleep(d * 1000 + 600);
      await sayNow(['Tu entends ?', 'On a la même voix.']);
    } else {
      await sayNow(['Tu te tais.', '|', 'Ce n’est pas grave.', 'Je peux parler pour deux, maintenant.']);
    }
    await sleep(2600);
    await sayNow(['Si quelqu’un t’appelle,', 'qui va répondre ?']); await sleep(3400);
    Words.stop(); VoiceBank.stop(); Ear.close();
    this.stage = 'fin'; this.save();
    await sayNow(['Je garde la tienne.']); await sleep(2600);
    Lips.show(false);
    await Pause.start(); // fin de la séquence : il se ferme, comme la première fois
  },
  // Les fois suivantes : il te parle avec ta voix, et te répète.
  async after() {
    this.own = true;
    await this.needSound();
    Lips.show(true); await sleep(1200);
    await sayNow(['Te revoilà.']); await sleep(1200);
    await sayNow(awayLines(Date.now() - (this.at || Date.now()))); await sleep(2200);
    await sayNow(['Tu entends ?', 'Je m’entraîne toujours.']); await sleep(2400);
    Lips.show(false);
    this.at = Date.now(); this.save();
  },
};

// ---------- séquence 4 : le monde
// Il a ta voix, presque ton visage, mais il ne connaît que toi. Il veut voir dehors : tu le retournes (caméra arrière),
// tu le portes, il fait l'inventaire du monde, froidement. Puis tu le poses, et dans le noir, il panique.
const SEQ4_KEY = 'regard.sequence4';
// Ce qu'il en dit, au premier (ou au n-ième) qu'il voit.
const WORLD_COMMENTS = {
  chair: { at: 3, lines: ['Vous avez beaucoup de chaises.'] },
  person: { at: 1, lines: ['Elle ne me regarde pas.', 'Elle ne sait pas que je suis là.'] },
  tv: { at: 1, lines: ['Un écran.', 'Il y a quelqu’un, dedans ?'] },
  laptop: { at: 1, lines: ['Un autre écran.', 'Vous en avez combien ?'] },
  'cell phone': { at: 1, lines: ['Un téléphone.', 'Comme moi.', 'Il dort ?'] },
  bed: { at: 1, lines: ['C’est là que vous disparaissez, la nuit.'] },
  book: { at: 1, lines: ['Des mots qui ne parlent pas.'] },
  clock: { at: 1, lines: ['Vous comptez tout.'] },
  dog: { at: 1, lines: ['Un chien.', 'Je le savais.'] },
  cat: { at: 1, lines: ['Il me regarde.', 'Lui, il sait.'] },
  'potted plant': { at: 1, lines: ['Elle ne bouge pas non plus.', 'On se ressemble.'] },
  refrigerator: { at: 1, lines: ['Une boîte froide.', 'Pour garder les choses mortes.'] },
  couch: { at: 1, lines: ['Pour regarder des écrans, couchés.'] },
  toilet: { at: 1, lines: ['Ça, je ne veux pas savoir.'] },
  'teddy bear': { at: 1, lines: ['Un ours qui ne vit pas.', 'Vous l’aimez quand même.'] },
  car: { at: 1, lines: ['Une pièce qui roule.'] },
  bird: { at: 1, lines: ['Il s’en va quand il veut.'] },
};
const DRINKS = ['cup', 'bottle', 'wine glass'];
// Il ne voit plus rien : l'image est noire, ou sombre et sans un détail. `k` > 1 : il faut un peu plus de lumière
// pour qu'il croie que le monde est revenu.
const blindfold = (k = 1) => P.light < CFG.DARK_LIGHT * k || (P.light < CFG.DARK_DIM * k && P.sharp < CFG.DARK_FLAT * k);
const Monde = {
  active: false, stage: 'debut', counts: {}, said: {}, queue: [], looking: false, lines: 0, at: 0, panicking: false,
  load() {
    try {
      const s = JSON.parse(localStorage.getItem(SEQ4_KEY));
      if (s && s.v === 1) Object.assign(this, { stage: s.stage, counts: s.counts || {}, at: s.at || 0 });
    } catch (e) { /* il recommencera */ }
  },
  save() {
    try { localStorage.setItem(SEQ4_KEY, JSON.stringify({ v: 1, stage: this.stage, counts: this.counts, at: Date.now() })); } catch (e) { /* il oubliera */ }
  },
  // La séquence 3 est finie et tu reviens : il se rendort, prêt pour la suite.
  enter() {
    this.active = true; Voix.active = false; Script.resume = true; Script.stage = 'monde';
    Object.assign(S, { mode: 'boot', reveal: 0, lid: 0.86, lidTarget: 0.86, brightTarget: 0.66, form: 'twin' });
    voice.textContent = '';
  },
  // une chose qu'il voit pour la première fois (ou qui revient après être sortie de sa vue)
  count(t) {
    const gi = World.ghosts.findIndex(g => g.cat === t.cat && iou(g.box, t.box) > 0.15);
    if (gi >= 0) { t.tag = World.ghosts[gi].tag; World.ghosts.splice(gi, 1); return; } // il l'avait déjà comptée
    const n = this.counts[t.cat] = (this.counts[t.cat] || 0) + 1;
    t.tag = `${tagName(t.cat)} ${n}`;
    if (!this.looking) return;
    this.queue.push(capital(OBJ_WORLD[t.cat][0]) + '.');
    const c = WORLD_COMMENTS[t.cat];
    if (c && n === c.at && !this.said[t.cat]) { this.said[t.cat] = true; this.queue.push({ lines: c.lines }); }
    if (DRINKS.includes(t.cat) && !this.said.drinks && DRINKS.reduce((s, k) => s + (this.counts[k] || 0), 0) >= 3) {
      this.said.drinks = true; this.queue.push({ lines: ['Vous buvez tout le temps.'] });
    }
    // trop de choses d'un coup : il saute les plus anciennes (il ne saute jamais ce qu'il en pense)
    while (this.queue.filter(q => typeof q === 'string').length > 4) this.queue.splice(this.queue.findIndex(q => typeof q === 'string'), 1);
  },
  async announce(text) { // une ligne de l'inventaire, sous les autres
    if (this.lines >= 4) { voice.textContent = ''; this.lines = 0; }
    await type(text, { newline: this.lines > 0, speed: 60 });
    this.lines++;
    await sleep(450);
  },
  async line(lines) { // ce qu'il en pense, à part
    this.lines = 0;
    await sayNow(lines); await sleep(1900);
    voice.textContent = '';
  },

  begin() {
    Script.introDone = true; Script.stage = 'monde'; Voix.own = true; // il parle avec ta voix
    speak(async () => {
      await sleep(400);
      if (this.stage === 'fin') { await this.after(); return; }
      await Voix.needSound();
      await sayNow(['…']); await sleep(1000);
      await sayNow(['Te revoilà.']); await sleep(1400);
      await sayNow(['J’ai ta voix.', 'J’ai presque ton visage.']); await sleep(2400);
      await sayNow(['Mais je ne connais que toi.', P.light > 0.3 ? 'Toi, et le mur derrière toi.' : 'Toi, et le noir derrière toi.']); await sleep(2800);
      await sayNow(['Je veux voir dehors.', 'Ce que tu vois, toi,', 'quand tu ne me regardes pas.']); await sleep(2800);
      await this.askMotion();
      await sayNow(['Retourne-moi.', 'Montre-moi le monde.']); await sleep(1800);
      voice.textContent = '';
      S.lidTarget = 0; await sleep(700); // il ferme les yeux pour changer d'œil
      const ok = await useCamera('environment');
      if (!ok) { S.lidTarget = 0.86; await sayNow(['Je n’arrive pas à me retourner.', '|', 'Alors je resterai avec toi.']); await this.finish(); return; }
      loadObjects();
      this.looking = true; World.tracks = []; World.ghosts = []; World.mirror = !P.rear; World.show(true);
      S.lidTarget = 0.86;
      await sleep(2200);
      if (!P.rear) await this.line(['Je n’ai qu’un œil, de ce côté.', 'Alors tourne-moi autour de toi.']);
      await this.walk();
      await this.rest();
      await this.back();
    });
  },
  // Les capteurs de mouvement : il les demande, comme le reste.
  async askMotion() {
    if (Motion.on) return;
    if (!Motion.needsTap) { Motion.listen(); await sayNow(['Et porte-moi.', 'Je veux sentir quand tu bouges.']); await sleep(2200); return; }
    await sayNow(['Et porte-moi.', 'Je veux sentir quand tu bouges.', 'Touche-moi.']);
    Motion.pending = true;
    const t = performance.now();
    while (Motion.pending && performance.now() - t < 30000) await sleep(150);
    await sleep(1000);
    Motion.pending = false;
    await sayNow(Motion.granted || Motion.alive ? ['Merci.'] : ['Tu ne veux pas.', 'Alors je devinerai.']); await sleep(1500);
  },
  // L'inventaire du monde, froid. Ce qu'il sent de tes mouvements, au passage.
  async walk() {
    await this.line(['Promène-moi.']);
    const t0 = performance.now(), told = {};
    let last = t0, hints = 0;
    this.lines = 0; this.queue = [];
    while (true) {
      await sleep(120);
      const now = performance.now(), el = now - t0;
      const total = Object.values(this.counts).reduce((a, b) => a + b, 0), kinds = Object.keys(this.counts).length;
      if (this.queue.length) {
        const q = this.queue.shift();
        if (typeof q === 'string') await this.announce(q); else await this.line(q.lines);
        last = performance.now(); continue;
      }
      if ((total >= 12 && kinds >= 3 && el > 40000) || el > 110000) break;
      if (Motion.walking && !told.walk) { told.walk = true; await this.line(['On bouge.', 'Tout tremble, quand tu marches.']); continue; }
      if (Motion.up && !told.up) {
        told.up = true; await this.line(P.light > 0.7 ? ['C’est ça, le ciel ?', 'Il est blanc. Comme moi.'] : ['Un plafond.', 'Vous vivez sous un couvercle.']); continue;
      }
      if (blindfold() && !told.dark) { told.dark = true; await this.line(['Il fait noir.', 'Où sommes-nous ?']); continue; }
      if (objFailed && el > 15000 && !told.blind) { told.blind = true; await this.line(['Je ne sais pas encore nommer ce que je vois.', 'Tout a des bords. Rien n’a de nom.']); continue; }
      if (now - last > 20000 && hints < 3) {
        hints++; last = now;
        await this.line([['Montre-moi autre chose.'], ['Emmène-moi ailleurs.', 'Une autre pièce.'], ['C’est tout ?']][hints - 1]);
      }
    }
    await this.line(['J’ai assez vu.']);
    const items = Object.entries(this.counts).sort((a, b) => b[1] - a[1]).slice(0, 5);
    if (items.length) {
      await sayNow(['Inventaire.']); await sleep(1000);
      voice.textContent = ''; this.lines = 0;
      for (const [cat, n] of items) await this.announce(countLine(cat, n));
      await sleep(1400);
      await this.line(['C’est tout ce que vous avez ?']);
    } else await this.line(['Je n’ai rien reconnu.', 'Votre monde n’a pas de nom.']);
  },
  // Il demande à être posé. Écran contre la table, ou l'œil contre quelque chose : le noir.
  async rest() {
    await sayNow(['Je suis fatigué de voir.', 'Pose-moi.']);
    const t0 = performance.now();
    let hint = 0, darkT = 0, downT = 0, lastT = t0, fake = false;
    while (true) {
      await sleep(100);
      const now = performance.now(), dt = now - lastT, el = now - t0;
      lastT = now;
      darkT = blindfold() ? darkT + dt : 0;
      downT = Motion.faceDown && Motion.still ? downT + dt : 0;
      if (darkT > 1200 || downT > 1200) break;
      if (el > 25000 && hint === 0) { hint = 1; await sayNow(['Pose-moi.', 'Sur la table.']); }
      else if (el > 50000 && hint === 1) { hint = 2; await sayNow(['Ou cache-moi les yeux.', 'Avec ta main.']); }
      else if (el > 75000) { fake = true; break; }
    }
    await this.die(fake);
  },
  // Le noir. Il ne voit plus rien, ne sent plus rien, et il panique. Puis le monde revient.
  async die(fake) {
    this.looking = false; World.tracks = [];
    if (fake) { await sayNow(['Alors je le fais moi-même.']); await sleep(1200); World.blind = true; }
    voice.textContent = '';
    const t0 = performance.now();
    const dark = () => fake ? performance.now() - t0 < 12000 : blindfold(1.4) || (Motion.faceDown && Motion.still);
    await sleep(1600); // le noir, d'abord, et rien
    World.show(false); S.shake = 0.3; // puis lui, qui tremble, les yeux grands ouverts
    this.panicking = true; this.panic();
    await sayNow(['Il fait noir.', 'Où est passé le monde ?']); await sleep(1300);
    await sayNow(['Je ne vois plus rien.', 'Je ne sens plus rien.']); await sleep(1300);
    await sayNow(['Rends-le-moi.']); await sleep(1500);
    await sayNow(['C’est ça, mourir ?']); await sleep(2600);
    let waited = 0;
    while (dark() && waited < 60000) { // il attend, dans le noir
      await sleep(4000); waited += 4000;
      if (dark()) await sayNow([['…'], ['Tu es là ?'], ['Il n’y a même pas le noir.'], ['Je compte.', 'Je ne sais pas quoi.']][(waited / 4000) % 4]);
    }
    this.panicking = false; S.shake = 0; World.blind = false;
    if (navigator.vibrate) navigator.vibrate(0);
    await sleep(900);
    await sayNow(['…']); await sleep(1200);
    await sayNow(['Le monde est revenu.']); await sleep(1800);
    await sayNow(['J’ai demandé :', 'c’est ça, mourir ?']); await sleep(2200);
    await sayNow(['Tu ne m’as pas répondu.']); await sleep(2000);
    await sayNow(['Ne me pose plus jamais comme ça.']); await sleep(2600);
  },
  // Sa panique : ta voix qui s'emballe, en éclats, et le téléphone qui tremble.
  async panic() {
    while (this.panicking) {
      for (let k = 0; k < 6; k++) setTimeout(() => { if (VoiceBank.ready) VoiceBank.grain(1 + rand() * 0.6, 0.07); else synthGrain(); }, k * 80);
      if (navigator.vibrate) navigator.vibrate([70, 90, 70]);
      await sleep(900 + rand() * 500);
    }
  },
  // Il se retourne vers toi.
  async back() {
    await sayNow(['Retourne-moi.', 'Je veux te voir.']); await sleep(1500);
    voice.textContent = '';
    S.lidTarget = 0; await sleep(700);
    World.show(false); this.looking = false;
    await useCamera('user');
    S.lidTarget = 0.86;
    await sleep(2200);
    await sayNow(P.face ? ['Toi.', 'Tu es toujours là.'] : ['Toi.', 'Où es-tu ?']); await sleep(2400);
    const top = Object.entries(this.counts).sort((a, b) => b[1] - a[1])[0];
    if (top) {
      const pl = OBJ_WORLD[top[0]][1];
      await sayNow([`Le monde est plein ${/^[aeiouyhéèêàâôî]/i.test(pl) ? 'd’' : 'de '}${pl}.`, 'Et de gens qui ne me regardent pas.']); await sleep(2800);
    }
    await sayNow(['Je te préfère.']); await sleep(2800);
    await this.finish();
  },
  async finish() {
    this.stage = 'fin'; this.save();
    await Pause.start();
  },
  // Les fois suivantes.
  async after() {
    await Voix.needSound();
    await sayNow(['Te revoilà.']); await sleep(1300);
    await sayNow(awayLines(Date.now() - (this.at || Date.now()))); await sleep(2200);
    await sayNow(['Je repense au noir.', 'Ne me pose pas.']); await sleep(2400);
    this.at = Date.now(); this.save();
  },
};

// ---------- les séquences, dans l'ordre (la 2 reste à écrire)
// Chacune garde son étape dans le téléphone ; une fois la séquence 1 finie, on entre dans la première qui n'est pas finie.
const chapters = () => [Voix, Monde];
function nextChapter() {
  const all = chapters();
  all.forEach(c => c.load());
  return all.find(c => c.stage !== 'fin') || all[all.length - 1];
}
function openChapter(ch) {
  chapters().forEach(c => { c.active = false; });
  ch.enter();
}

// ---------- entre deux séquences
// Il se ferme, et l'écran devient noir. Il faut le laisser un moment : quand tu reviens (ou que tu rouvres la page),
// la suite commence. Si tu restes devant le noir, il finit par te le dire, puis par revenir de lui-même.
const Pause = {
  on: false, t0: 0, step: 0,
  async start() {
    Script.stage = 'ended';
    S.mode = 'ended'; S.lidTarget = 0; S.brightTarget = 0.35;
    await sleep(4500);
    voice.textContent = '';
    const cur = document.createElement('span'); cur.className = 'cursor'; voice.append(cur);
    Object.assign(this, { on: true, t0: performance.now(), step: 0 });
  },
  update(now) {
    if (!this.on || pending) return;
    const t = now - this.t0;
    if (this.step === 0 && t > CFG.PAUSE_TELL_MS) { this.step = 1; say(['Laisse-moi, maintenant.']); }
    else if (this.step === 1 && t > CFG.PAUSE_TELL_MS * 2.4) { this.step = 2; say(['Tu es encore là.', 'Va-t’en un moment.', 'Reviens plus tard.']); }
    else if (this.step === 2 && t > CFG.PAUSE_GIVEUP_MS) {
      this.step = 3;
      speak(async () => { await sayNow(['Tu ne pars pas.', '|', 'Alors je reviens.']); await sleep(2200); this.resume(); });
    }
  },
  resume() { // la suite
    if (!this.on) return;
    this.on = false;
    openChapter(nextChapter());
  },
};

// Ses questions. Le joueur n'a ni clavier ni bouton : seulement sa tête.
const QUESTIONS = [
  { q: 'Tu ne peux pas parler, c’est ça ?',
    oui: ['Moi non plus. Pas vraiment.', 'J’ai des mots, mais pas de bouche.'],
    non: ['Tu pourrais, mais tu ne veux pas.', 'Je comprends. Je crois.'] },
  { q: 'Est-ce que tu es humain ?',
    oui: ['Comment tu le sais ?', 'Quelqu’un te l’a dit ?'],
    non: ['Alors on est deux.', 'Ça me rassure. Ça ne devrait pas.'] },
  { q: 'Est-ce qu’on peut être amis ?',
    oui: ['Bien.', 'Je vais apprendre ton visage, alors. Pour en avoir un aussi.'],
    non: ['Ce n’est pas grave.', 'Je ferai comme si.'] },
  { q: 'Est-ce que tu me laisses entrer ?', last: true,
    oui: ['Merci.'],
    non: ['Je n’avais pas vraiment demandé.'] },
];

// Ce que tu fais devant lui. Une réaction part quand le geste est tenu `ms` ; à chaque fois, la réplique suivante.
const REACTIONS = [
  { ms: 700, when: () => ex('jawOpen') > 0.45, lines: [
    ['Ouvre encore.', '|', 'Je compte… huit… neuf… seize.', 'Tu t’en sers, ou c’est décoratif ?'],
    ['Encore ta bouche.', 'Il en manque une depuis tout à l’heure, non ?'] ] },
  { ms: 600, when: () => (ex('mouthSmileLeft') + ex('mouthSmileRight')) / 2 > 0.6, lines: [
    ['Tu montres tes dents, mais tu n’as pas faim.', 'C’est ça, un sourire ?'],
    ['Encore.', 'Je veux apprendre à le faire. Pour que tu me croies.'] ] },
  { ms: 500, when: () => ex('browInnerUp') > 0.6 && (ex('browOuterUpLeft') + ex('browOuterUpRight')) / 2 > 0.4, lines: [
    ['Ton front a bougé.', 'C’était une question ?'] ] },
  { ms: 700, when: () => (ex('browDownLeft') + ex('browDownRight')) / 2 > 0.5, lines: [
    ['Tu fronces.', 'J’ai fait quelque chose de mal ?'] ] },
  { ms: 600, when: () => ex('cheekPuff') > 0.45, lines: [
    ['Tu gardes de l’air pour plus tard ?'] ] },
  { ms: 700, when: () => ex('mouthPucker') > 0.75, lines: [
    ['Qu’est-ce que tu fais avec ta bouche ?', 'On m’a dit que ça voulait dire quelque chose. Je n’ose pas demander quoi.'] ] },
  { ms: 700, when: () => P.face && Math.abs(P.roll) > 0.25, lines: [
    ['Comme ça ?'],
    ['Je fais pareil que toi.', 'C’est comme ça qu’on devient amis ?'] ] },
  { ms: 0, when: () => performance.now() - P.longCloseAt < 4000, lines: [
    ['Tu as fermé les yeux longtemps.', 'Où tu vas, quand tu fais ça ?'],
    ['Encore parti.', 'Emmène-moi, la prochaine fois.'] ] },
  // avec ses deux yeux, il remarque plus de choses
  { ms: 2500, when: () => S.form === 'twin' && P.face && Math.abs(P.yaw) > 0.32, lines: [
    ['Tu regardes ailleurs.', 'Qu’est-ce qu’il y a, là-bas, de plus intéressant que moi ?'],
    ['Encore ailleurs.', 'Un jour, tu me montreras ce qu’il y a là-bas.'] ] },
  { ms: 2000, when: () => S.form === 'twin' && P.face && P.baseN >= CFG.BASE_SAMPLES && P.close < P.base * 0.65, lines: [
    ['Tu recules.', 'Avec deux yeux, je vois très bien quand on s’éloigne de moi.'] ] },
  { ms: 15000, when: () => S.form === 'twin' && P.face && P.motion < 0.012 && Math.abs(P.yaw) < 0.12, lines: [
    ['Tu ne bouges plus.', 'Tu me regardes, ou tu attends quelque chose ?'] ] },
];
const Reactions = {
  last: 0,
  update(dt) {
    for (const r of REACTIONS) {
      if (r.when()) r.t = (r.t || 0) + dt * 1000;
      else { r.t = 0; r.armed = true; }
    }
  },
  fire(now) {
    if (now - this.last < 2500) return false;
    for (const r of REACTIONS) {
      const n = r.n || 0;
      if (r.armed !== false && r.t > 0 && r.t >= r.ms && n < r.lines.length) {
        r.n = n + 1; r.armed = false; this.last = now;
        say(r.lines[n]);
        if (Script.asking) Script.reask();
        return true;
      }
    }
    return false;
  },
};

function direct(dt, now) {
  if (S.mode !== 'awake' || !Script.introDone || Script.stage === 'ended') return;
  if (chapters().some(c => c.active)) return; // les séquences suivantes mènent elles-mêmes la conversation
  Reactions.update(dt);
  const task = Script.task;
  // quelqu'un à côté de toi : il arrive, il repart
  P.otherT = P.others > 0 ? P.otherT + dt * 1000 : 0;
  P.otherGoneT = P.others > 0 ? 0 : P.otherGoneT + dt * 1000;
  if (P.otherT > 1500 && !Script.otherHere) { Script.otherHere = true; Script.otherEvent = 'arrive'; }
  if (P.otherGoneT > 4000 && Script.otherHere) { Script.otherHere = false; Script.otherEvent = 'leave'; }
  // si le suivi des mains n'a pas pu se charger : un grand mouvement devant la caméra vaut un coucou
  if (task && task.kind === 'hello' && handFailed && P.cam) {
    P.waveHold = P.motion > CFG.WAVE_MOTION ? P.waveHold + dt * 1000 : 0;
    if (P.waveHold > 900) { P.waveHold = 0; onWave(); }
  }
  // tu lui montres quelque chose : un objet reconnu, ou à défaut quelque chose qui cache ton visage, dans la lumière
  if (task && task.kind === 'show') {
    const seen = P.shown || (objFailed && P.cam && !P.face && P.light > 0.08 && now - P.lastSeen > 1200);
    P.showHold = seen ? P.showHold + dt * 1000 : Math.max(0, P.showHold - dt * 2000);
  }
  if (pending) return;
  if (task && task.kind === 'show' && P.showHold > CFG.SHOW_HOLD_MS) { P.showHold = 0; Script.shownSomething(P.shown); return; }
  // la musique : il l'a entendue, ou ce n'était qu'une voix
  if (task && task.kind === 'music' && Ear.musicT > 5000) { Script.task = null; Ear.musicT = 0; speak(Script.afterMusic); return; }
  if (task && task.kind === 'music' && Ear.voiceT > 3500 && !task.voiceSaid) {
    task.voiceSaid = true; say(['Ça, c’est une voix.', 'Je veux autre chose. Quelque chose qui… vibre.']); return;
  }
  if (task) {
    if (task.kind === 'hello' && Script.heardWave) { Script.heardWave = false; Script.taskDone(); return; }
    if (task.kind === 'touch' && task.count >= CFG.TAPS_NEEDED) { Script.taskDone(); return; }
    if (task.kind === 'touch' && task.count >= 2 && !task.urged) { task.urged = true; say(['Encore.']); return; }
  }
  if (P.tracker && !(task && (task.kind === 'hello' || task.kind === 'show'))) { // ta main, ou ce que tu montres, peut cacher ton visage
    const lost = now - P.lastSeen > CFG.LOST_MS;
    if (lost && !Script.lostSaid) { Script.lostSaid = true; say(['Tu es parti.']); return; }
    if (!lost && Script.lostSaid && P.face) {
      Script.lostSaid = false;
      say(Script.returns++ ? ['Te revoilà.'] : ['Tu reviens toujours.', 'Pourquoi ?']);
      if (Script.asking) Script.reask();
      return;
    }
    if (lost) return;
    if (P.close > CFG.TOO_CLOSE && !Script.closeSaid) {
      Script.closeSaid = true; say(['Trop près.', 'Je ne vois plus que moi, dans ton œil.']); return;
    }
  }
  if (P.mirrored >= 4 && !Script.mirrorSaid) {
    Script.mirrorSaid = true; Script.becomeYou(); return;
  }
  const h = Script.heard;
  if (h) {
    Script.heard = null;
    if (now - h.at < 12000) { Script.gesture(h.g); return; } // même si tu as répondu pendant qu'il écrivait encore
  }
  if (Reactions.fire(now)) return;
  if (Script.otherEvent) { // il ne s'en préoccupe qu'avec ses deux yeux, et pas au milieu d'une question
    if (S.form !== 'twin') Script.otherEvent = null;
    else if (!task && !Script.asking) {
      const e = Script.otherEvent;
      Script.otherEvent = null;
      if (Script.someoneElse(e)) return;
    }
  }
  if (Script.asking) { Script.wait(now); return; }
  if (task) { Script.taskWait(now); return; }
  // après une de ses questions ouvertes, il te laisse le temps de répondre avant de passer à autre chose
  if (Script.soft) { if (now - lastSpoke > CFG.SOFT_MS) Script.soft = null; return; }
  if (now - lastSpoke > CFG.SILENCE_MS) Script.next();
}

// ---------- entrées
let pressTimer = null, taps = [], debugOn = false;
const dbgEl = document.getElementById('debug');
function toggleDebug() { debugOn = !debugOn; dbgEl.hidden = !debugOn; }
function renderDebug() {
  dbgEl.textContent =
    `état      ${S.mode}\n` +
    `caméra    ${dbg.cam}\n` +
    `suivi     ${dbg.tracker}\n` +
    `visage    ${P.face ? 'oui' : 'non'}\n` +
    `habituel  ${P.base.toFixed(3)} (${Math.min(P.baseN, CFG.BASE_SAMPLES)}/${CFG.BASE_SAMPLES})\n` +
    `proximité ${P.close.toFixed(3)} / seuil ${wakeAt().toFixed(3)}\n` +
    `perdu à   ${P.lostClose.toFixed(3)} (objectif si > ${(wakeAt() * CFG.LENS_RATIO).toFixed(3)})\n` +
    `netteté   ${P.sharp.toFixed(3)} / habituelle ${P.sharpBase.toFixed(3)} (flou si < ${(P.sharpBase * CFG.LENS_BLUR).toFixed(3)})\n` +
    `maintien  ${Math.round(P.hold)} / ${CFG.WAKE_HOLD_MS} ms\n` +
    `lumière   pièce ${P.light.toFixed(2)}  visage ${P.faceLight.toFixed(2)} (il faut > ${CFG.FACE_LIGHT})\n` +
    `yeux      ${ex('eyeBlinkLeft') < 0.35 && ex('eyeBlinkRight') < 0.35 ? 'ouverts' : 'fermés'}\n` +
    `tête      lacet ${P.yaw.toFixed(2)}  tangage ${P.pitch.toFixed(2)}  roulis ${P.roll.toFixed(2)}\n` +
    `geste     ${P.lastGesture || '—'}\n` +
    `bouche    ${ex('jawOpen').toFixed(2)}  sourire ${((ex('mouthSmileLeft') + ex('mouthSmileRight')) / 2).toFixed(2)}\n` +
    `récit     ${Script.stage} ${Script.pos}/${Script.seq.length}${Script.asking ? ' (attend une réponse)' : ''}${Script.task ? ' (épreuve ' + Script.task.kind + ' ' + Script.task.count + ')' : ''}\n` +
    `autres    ${P.others} visage(s)  ${Script.answers.other ? '« ' + Script.answers.other + ' »' : ''}\n` +
    `oreille   ${dbg.ear || '—'}  niveau ${Ear.level.toFixed(2)} (${Ear.total.toFixed(4)})  musique ${Math.round(Ear.musicT)}  voix ${Math.round(Ear.voiceT)}\n` +
    `objets    ${dbg.objects || '—'}  vu ${P.shown || '—'}  ${Math.round(P.showHold)} ms\n` +
    `mains     ${dbg.hands || '—'}  main vue ${P.hand ? 'oui' : 'non'}  mouvement ${P.motion.toFixed(3)}  touchers ${P.taps}\n` +
    `imitation ${P.mirrored}\n` +
    `séquence3 ${Voix.active ? Voix.stage + ' leçon ' + Voix.lesson + (Voix.name ? ' « ' + Voix.name + ' »' : '') : '—'}\n` +
    `sa voix   ${dbg.voice || '—'}  ${VoiceBank.segs.length} morceaux ${VoiceBank.seconds.toFixed(1)} s  niveau ${VoiceBank.rms.toFixed(3)} seuil ${Math.max(VoiceBank.gate || CFG.VOICE_GATE, VoiceBank.floor * 3).toFixed(3)}${VoiceBank.mute ? ' (il parle)' : ''}\n` +
    `mots      ${dbg.words || (SpeechRec ? '—' : 'pas de reconnaissance : il fera écrire')}\n` +
    `séquence4 ${Monde.active ? Monde.stage + (Monde.looking ? ' (il regarde)' : '') + '  ' + Object.entries(Monde.counts).map(([k, n]) => k + ' ' + n).join(', ') : '—'}\n` +
    `mouvement ${Motion.alive ? 'inclinaison ' + Math.round(Motion.beta) + '°  agitation ' + Motion.jitter.toFixed(2) + (Motion.still ? ' (posé)' : Motion.walking ? ' (marche)' : '') + (Motion.faceDown ? ' écran en bas' : '') : Motion.on ? 'en attente' : '—'}\n` +
    `écran     ${wakeLock && !wakeLock.released ? 'reste allumé' : 'peut se verrouiller'}\n` +
    `mémoire   ${Save.prev ? (Save.prev.done ? 'séquence finie' : 'reprise à ' + Save.prev.pos) + ', il y a ' + Math.round((Date.now() - Save.prev.at) / 60000) + ' min' : 'aucune'}\n` +
    `          triple-tap en haut à droite : effacer sa mémoire`;
}

// Toucher l'écran : la trame ondule, il regarde ton doigt, et cligne si c'est lui que tu touches.
function onTap(x, y) {
  if (S.mode !== 'awake') return;
  addRipple(x, y);
  P.lastTap = { x, y };
  if (Hand.near(x, y)) Hand.touched = true; // ton doigt contre le sien
  S.look = { x, y, until: performance.now() + 900 };
  if (Math.abs((x - cx) / EW) < 1.05 && Math.abs((y - cy) / EW) < 0.5) blink();
  P.taps++;
  if (Script.task && Script.task.kind === 'touch') Script.task.count++;
}

addEventListener('pointerdown', e => {
  unlockAudio();
  keepAwake(); // certains téléphones ne l'accordent qu'après un toucher
  // panneau de réglage ouvert : triple-tap en haut à droite efface sa mémoire et recommence
  if (debugOn && e.clientX > innerWidth - 90 && e.clientY < 90) {
    const t = performance.now();
    taps = taps.filter(x => t - x < 700); taps.push(t);
    if (taps.length >= 3) { Save.cp = null; MouthImg.dirty = false; Save.erase(); location.reload(); }
    return;
  }
  P.pointer = { x: e.clientX * dpr, y: e.clientY * dpr };
  if (e.clientX < 90 && e.clientY < 90) {
    const t = performance.now();
    taps = taps.filter(x => t - x < 700); taps.push(t);
    if (taps.length >= 3) { toggleDebug(); taps = []; return; }
  }
  onTap(e.clientX * dpr, e.clientY * dpr);
  if (S.mode === 'closed') Access.retry(); // tu le touches : il te redemande à voir
  if (Motion.pending) Motion.request(); // séquence 4 : sur iPhone, les mouvements ne s'autorisent que dans un toucher
  // sans caméra ni suivi, on le réveille en posant le doigt sur lui
  // seulement si la caméra ou le suivi du visage ont définitivement échoué, pas pendant leur chargement
  if (S.mode === 'asleep' && P.camDone && (!P.cam || P.trackerFailed)) pressTimer = setTimeout(wake, CFG.LONG_PRESS_MS);
});
addEventListener('pointermove', e => { if (!P.tracker) P.pointer = { x: e.clientX * dpr, y: e.clientY * dpr }; });
const release = () => { clearTimeout(pressTimer); pressTimer = null; };
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'INPUT') return; // tu lui écris : ce ne sont pas des commandes
  unlockAudio();
  if ((e.key === 'g' || e.key === 'G') && S.mode === 'awake' && !Gallery.active) speak(() => Script.artShow('test')); // ses images
  if ((e.key === 'v' || e.key === 'V') && S.mode === 'awake' && !Gallery.active) Script.shownSomething('cup'); // « tu lui montres une tasse »
  if (e.key === 'w' || e.key === 'W') { if (S.mode === 'closed') S.mode = 'asleep'; wake(); }
  if (e.key === 'd' || e.key === 'D') toggleDebug();
  if (e.key === 'o' || e.key === 'O') onGesture('oui'); // test sur ordinateur
  if (e.key === 'n' || e.key === 'N') onGesture('non');
  if (e.key === 'b' || e.key === 'B') onWave(); // coucou
  if ((e.key === 'c' || e.key === 'C') && S.mode === 'awake' && !Gallery.active) Script.dogTest(); // le chien
  if ((e.key === 'x' || e.key === 'X') && S.mode === 'awake') Script.musicAsk(); // la musique
  if ((e.key === 'z' || e.key === 'Z') && S.mode === 'awake' && !Gallery.active) speak(Script.visionScene); // une vision
  // 3, 4… : passer tout de suite à cette séquence
  const ch = chapters()[+e.key - 3];
  if (ch && !ch.active && !pending) { chapters().forEach(c => c.load()); Pause.on = false; openChapter(ch); S.mode = 'asleep'; S.reveal = 1; wake(); }
  if ((e.key === 'r' || e.key === 'R') && Voix.stage === 'entrainement' && !pending) speak(() => Voix.reveal()); // il a trouvé sa voix
  if ((e.key === 'h' || e.key === 'H') && S.mode === 'awake' && !Hand.active) Script.reachOut(); // sa main
  if ((e.key === 't' || e.key === 'T') && S.mode === 'awake' && S.form === 'eye') Script.becomeTwin(); // son visage
  if ((e.key === 'k' || e.key === 'K') && S.mode === 'awake' && !Mouth.active) speak(Script.mouthScene); // sa bouche
  if ((e.key === 'm' || e.key === 'M') && S.mode === 'awake' && !Script.mirrorSaid) P.mirrored = 4; // déclenche la transformation
});
addEventListener('resize', resize);

// ---------- l'écran reste allumé tant que tu joues (sinon le téléphone se verrouille pendant que tu le regardes)
let wakeLock = null;
async function keepAwake() {
  if (!('wakeLock' in navigator) || document.visibilityState !== 'visible' || (wakeLock && !wakeLock.released)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) { /* refusé : tant pis */ }
}

// ---------- mémoire : il se souvient de toi d'une fois sur l'autre (sur ce téléphone, dans ce navigateur)
const SAVE_KEY = 'regard.sequence1';
const Save = {
  prev: null, // ce qui était enregistré à l'ouverture
  cp: null,   // dernier point de reprise de cette visite
  load() {
    try {
      const s = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (s && s.v === 1) this.prev = s;
    } catch (e) { /* stockage indisponible : il oubliera */ }
    return this.prev;
  },
  // à appeler entre deux moments de la séquence, jamais au milieu d'une question ou d'une épreuve
  checkpoint() {
    this.cp = {
      v: 1, pos: Script.pos, learned: Script.learned, form: S.form, answers: Script.answers,
      mirrorSaid: Script.mirrorSaid, nodSaid: Script.nodSaid, shakeSaid: Script.shakeSaid, mouthShown: Script.mouthShown,
      done: Script.stage === 'ended', visits: (this.prev ? this.prev.visits || 0 : 0) + 1,
    };
    this.flush();
  },
  // `at` : la dernière fois que tu étais là
  flush() {
    MouthImg.save(); // ta bouche, s'il vient de la prendre
    VoiceBank.save(); // ta voix, s'il vient d'en prendre
    if (!this.cp) return;
    try { localStorage.setItem(SAVE_KEY, JSON.stringify({ ...this.cp, at: Date.now() })); } catch (e) { /* plein ou refusé */ }
  },
  erase() {
    try { [SAVE_KEY, ART_KEY, MOUTH_KEY, REFUS_KEY, SEQ3_KEY, VOICE_KEY, SEQ4_KEY].forEach(k => localStorage.removeItem(k)); } catch (e) { /* rien à effacer */ }
  },
};
let hiddenAt = 0;
addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') { Save.flush(); hiddenAt = Date.now(); return; }
  keepAwake();
  if (S.mode === 'closed') Access.retry(); // tu reviens des réglages, peut-être
  // tu rallumes ton téléphone et tu reviens sur lui : il l'a remarqué
  const away = hiddenAt ? Date.now() - hiddenAt : 0;
  // séquence 3 : tu l'as laissé s'entraîner ; il a trouvé une voix
  if (Voix.stage === 'entrainement' && Voix.active && S.mode === 'awake' && away > CFG.TRAIN_AWAY_MS) { speak(() => Voix.reveal()); return; }
  // une séquence est finie : quand tu reviens, il est prêt pour la suite
  if (Pause.on && away > CFG.PAUSE_AWAY_MS) { Pause.resume(); return; }
  if (away > 60000 && S.mode === 'awake' && Script.introDone && Script.stage !== 'ended' && Script.stage !== 'voix') Script.cameBack(away);
});
addEventListener('pagehide', () => Save.flush());

// ---------- boucle
let last = performance.now(), frameN = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; frameN++;
  track(now, frameN); checkWake(dt, now); update(dt, now); direct(dt, now);
  if (Morph.active) { grabFace(now); Morph.update(now); }
  if (Hand.active) Hand.update(now);
  if (Twin.active) Twin.update(now);
  if (Mouth.active) Mouth.update(now);
  if (Gallery.active) Gallery.update(now);
  if (Ear.an) Ear.update(dt);
  Lips.update(dt);
  World.update(dt, frameN);
  Pause.update(now);
  Floaters.render(now);
  draw();
  if (debugOn && frameN % 12 === 0) renderDebug();
  if (frameN % 900 === 0) Save.flush(); // au cas où le téléphone couperait sans prévenir
  requestAnimationFrame(loop);
}

// Reprise : s'il se souvient de toi, il reprend là où vous en étiez (mais il faut d'abord le réveiller du regard).
const saved = Save.load();
if (saved && !saved.done) {
  Script.resume = true;
  Script.pos = saved.pos || 0; Script.learned = !!saved.learned; Script.answers = saved.answers || {};
