<style>
/* Une seule scène plein écran : la trame de l'œil (canvas), sa voix en dessous. Aucun ATH. */
:root{
  --void:#000;
  --ink:#d8d8d2;          /* points de la trame */
  --voice:#f0f0ea;        /* texte de l'œil */
  --dim:#6b6b66;          /* panneau debug */
  --font-voice:"VT323", ui-monospace, "Courier New", monospace;
  --font-debug:ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--void);overflow:hidden;overscroll-behavior:none}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#eye{position:fixed;inset:0;width:100%;height:100%;display:block}
#cam{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none}
#voice{
  position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12vh);margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-family:var(--font-voice);font-size:clamp(22px,6.4vw,36px);line-height:1.12;letter-spacing:.06em;
  color:var(--voice);text-transform:uppercase;text-align:center;text-wrap:balance;pointer-events:none;
}
#voice .cursor{display:inline-block;width:.5em;height:.86em;margin-left:.12em;vertical-align:-.06em;background:var(--voice);animation:blink 1.06s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#debug{
  position:fixed;margin:0;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(12px,env(safe-area-inset-left,0px));
  font:12px/1.4 var(--font-debug);color:var(--dim);white-space:pre;pointer-events:none;
}
@media (prefers-reduced-motion:reduce){#voice .cursor{animation:none}}

<body>
<canvas id="eye" aria-label="Un œil, immobile"></canvas>
<video id="cam" playsinline muted autoplay></video>
<p id="voice" aria-live="polite"></p>
<pre id="debug" hidden></pre>

<script>
// Séquence 1 : Premier Regard. La première des séquences où l'on retrouve l'œil.
(() => {
'use strict';

// Réglages. Le panneau debug (triple-tap en haut à gauche, ou touche D) affiche les valeurs mesurées.
const CFG = {
  // Proximité = écart entre les coins externes des yeux / petit côté de l'image. Elle varie d'un téléphone
  // à l'autre : on mesure d'abord ta distance habituelle, puis il faut venir nettement plus près.
  WAKE_RATIO: 1.8,      // nettement plus près que ta distance habituelle
  WAKE_MIN: 0.36,       // et jamais sous ce seuil absolu
  WAKE_HOLD_MS: 1400,   // temps à soutenir le regard de près, yeux ouverts, avant le réveil
  FACE_LIGHT: 0.32,     // lumière minimale sur ton visage : dans l'ombre, il ne te voit pas assez
  LENS_RATIO: 0.95,     // visage perdu juste après avoir atteint le seuil…
  LENS_BLUR: 0.55,      // …et image devenue floue (netteté < 55 % de l'habituelle) = un œil collé à l'objectif
  LENS_WINDOW_MS: 4000,
  BASE_SAMPLES: 40,     // images utilisées pour mesurer ta distance habituelle
  TOO_CLOSE: 0.62,
  LOST_MS: 2600,        // absence du visage avant que l'œil le remarque
  SILENCE_MS: 7500,     // silence avant que l'œil reprenne la parole
  SOFT_MS: 10000,       // temps qu'il te laisse pour répondre oui / non à une de ses questions ouvertes
  NOD_RANGE: 0.08,      // amplitude d'un « oui » de la tête (en écarts d'yeux)
  SHAKE_RANGE: 0.10,    // amplitude d'un « non »
  EYES_SHUT_MS: 2500,   // yeux fermés assez longtemps pour qu'il le remarque
  WAVE_RANGE: 0.10,     // amplitude d'un coucou de la main (fraction de la largeur de l'image)
  WAVE_MOTION: 0.05,    // si le suivi des mains échoue : mouvement de l'image qui vaut un coucou
  TAPS_NEEDED: 5,       // tapotements sur l'écran pour lui montrer à quoi servent tes mains
  HAND_MODEL: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
  LONG_PRESS_MS: 1400,  // réveil de secours quand la caméra est indisponible
  CELLS_PER_EYE: 38,    // finesse de la trame (cellules par demi-largeur d'œil)
  MP: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',
  MODEL: 'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
};

// ---------- outils
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const mix = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const rand = Math.random;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function hash(x, y) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function noise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const a = hash(xi, yi), b = hash(xi + 1, yi), c = hash(xi, yi + 1), d = hash(xi + 1, yi + 1);
  const sx = xf * xf * (3 - 2 * xf), sy = yf * yf * (3 - 2 * yf);
  return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
}
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + 0.5) / 16);

// ---------- état de l'œil et de ce qu'il sait du joueur
const S = {
  mode: 'boot',                 // boot → asleep → waking → awake
  reveal: 0,
  lid: 0.86, lidTarget: 0.86, open: 0.86,
  bright: 0.66, brightTarget: 0.66,
  px: 0, py: 0.04, tx: 0, ty: 0.04, jx: 0, jy: 0,
  pupil: 0.6, pupilTarget: 0.6, pupilRate: 3,
  reflect: 0, reflectTarget: 0,
  blinkT: -1, blinkScale: 1.7, nextBlink: 0, nextSaccade: 0,
  grain: 0, grainT: 0,
  roll: 0, demo: null, look: null,
  morph: 0, morphKind: 'face', faceFlip: false, glitch: false, // quand il devient toi, une main, ou un visage
  form: 'eye', hx: 0, hy: 0, // 'eye' : un seul œil ; 'twin' : deux yeux et un visage, qui bouge un peu
};
const P = {
  cam: false, tracker: false, face: false,
  close: 0, cx: 0.5, cy: 0.5, blink: false,
  lastSeen: 0, light: 0.4, hold: 0, pointer: null, mirrored: 0,
  lostClose: 0, lostAt: 0, base: 0, baseN: 0, sharp: 0, sharpBase: 0,
  camDone: false, trackerFailed: false,
  bs: {}, yaw: 0, pitch: 0, roll: 0, closedAt: 0, longCloseAt: -1e9, lastGesture: null,
  faceLight: 0, lostLit: false,
  motion: 0, hand: false, waveHold: 0, taps: 0,
};
const ex = name => P.bs[name] || 0; // score d'une expression du visage, 0..1
const wakeAt = () => Math.max(CFG.WAKE_MIN, P.base * CFG.WAKE_RATIO);
const dbg = { cam: '…', tracker: '—' };

// ---------- rendu en trame
const cv = document.getElementById('eye');
const ctx = cv.getContext('2d', { alpha: false });
const video = document.getElementById('cam');
const INK = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#d8d8d2';
let W, H, dpr, cell, cols, rows, ox, oy, cx, cy, EW;

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.width = Math.round(innerWidth * dpr);
  H = cv.height = Math.round(innerHeight * dpr);
  EW = Math.min(W * 0.44, H * 0.3);
  cx = W / 2; cy = H * 0.42;
  cell = EW / CFG.CELLS_PER_EYE;
  cols = Math.ceil(W / cell); rows = Math.ceil(H / cell);
  ox = (W - cols * cell) / 2; oy = cy - Math.ceil(cy / cell) * cell;
}

// Image de la caméra réduite à 40×40, pour le reflet dans la pupille et la lumière de la pièce.
const camC = document.createElement('canvas'); camC.width = camC.height = 40;
const camX = camC.getContext('2d', { willReadFrequently: true });
const camL = new Float32Array(1600);
function grabCam() {
  const vw = video.videoWidth, vh = video.videoHeight; if (!vw) return;
  const s = Math.min(vw, vh);
  camX.drawImage(video, (vw - s) / 2, (vh - s) / 2, s, s, 0, 0, 40, 40);
  const d = camX.getImageData(0, 0, 40, 40).data; let sum = 0, mo = 0;
  for (let i = 0; i < 1600; i++) {
    const l = (d[i * 4] * 0.299 + d[i * 4 + 1] * 0.587 + d[i * 4 + 2] * 0.114) / 255;
    mo += Math.abs(l - camL[i]);
    camL[i] = l; sum += l;
  }
  P.light = mix(P.light, sum / 1600, 0.1);
  P.motion = mix(P.motion, mo / 1600, 0.3); // ce qui bouge devant lui
  // netteté de l'image : elle s'effondre quand un œil est collé à l'objectif (flou, plein cadre)
  let g = 0;
  for (let y = 0; y < 39; y++) for (let x = 0; x < 39; x++) {
    const i = y * 40 + x;
    g += Math.abs(camL[i + 1] - camL[i]) + Math.abs(camL[i + 40] - camL[i]);
  }
  P.sharp = mix(P.sharp, g / 1521, 0.2);
}
const camAt = (x, y) => camL[clamp(y * 40 | 0, 0, 39) * 40 + clamp(x * 40 | 0, 0, 39)];

const R = 0.37; // rayon de l'iris, en demi-largeur d'œil
function lum(u, v, gi, gj) {
  const e = (u * u) / 2.3 + (v * v) / 0.85;
  const env = Math.exp(-e * e * 1.4); // le visage se dissout dans le noir
  if (env < 0.004) return hash(gi, gj) > 0.9965 ? 0.1 : 0;

  // paupières
  const at = 1 - (u + 0.1) * (u + 0.1), ab = 1 - (u - 0.04) * (u - 0.04);
  const top0 = at > 0 ? -0.46 * Math.pow(at, 0.7) : 0;
  const bot0 = ab > 0 ? 0.36 * Math.pow(ab, 0.95) : 0;
  const m = Math.max(0, 1 - u * u) * 0.06;
  const top = m + (top0 - m) * S.open;
  const bot = m + (bot0 - m) * Math.min(1, S.open * 1.05);

  if (at > 0 && ab > 0 && v > top && v < bot) {
    const dT = v - top, dB = bot - v;
    const shadow = smooth(0, 0.2, dT);
    const ao = smooth(0, 0.08, Math.min(dT, dB));
    let L = (0.84 - 0.3 * u * u - 0.12 * v + (noise(u * 11 + 7, v * 11) - 0.5) * 0.1) * (0.32 + 0.68 * shadow) * (0.5 + 0.5 * ao);

    const dx = u - S.px, dy = v - S.py, r = Math.sqrt(dx * dx + dy * dy);
    if (r < R + 0.02) {
      const rn = r / R, rp = S.pupil;
      let ir;
      if (rn < rp) ir = 0.015;
      else {
        const a = Math.atan2(dy, dx), t = (rn - rp) / (1 - rp);
        const fib = 0.5 + 0.5 * Math.sin(a * 43 + Math.sin(a * 7) * 2.4 + t * 6);
        ir = 0.14 + 0.24 * fib * (0.45 + 0.55 * noise(a * 5 + 20, t * 5)) * (1 - t * 0.35);
        ir += 0.13 * Math.exp(-(((t - 0.2) / 0.07) ** 2));     // collerette
        ir *= 0.4 + 0.6 * smooth(1.0, 0.8, rn);               // anneau limbique
        ir = mix(0.015, ir, smooth(rp, rp + 0.05, rn));
      }
      // ton propre reflet, inversé comme dans un miroir
      if (S.reflect > 0.01 && P.cam) {
        const c = camAt(0.5 - dx / R * 0.55, 0.5 + dy / R * 0.55);
        ir += S.reflect * Math.max(0, c - 0.22) * 0.6 * smooth(1, 0.55, rn);
      }
      ir *= 0.3 + 0.7 * shadow;
      L = mix(L, ir, smooth(R + 0.016, R - 0.016, r));
    }
    const hx = u - (S.px * 0.6 - 0.12), hy = v - (S.py * 0.6 - 0.14), hd = hx * hx + hy * hy;
    if (hd < 0.0042) L = Math.max(L, (1 - hd / 0.0042 * 0.4) * (0.4 + 0.6 * shadow));
    return L * S.bright * (0.6 + 0.4 * env);
  }

  // peau
  let d, above;
  if (at > 0 && ab > 0) { above = v < top; d = above ? top - v : v - bot; }
  else { above = v < 0; d = Math.hypot(Math.abs(u) - 0.97, v * 0.9); }
  let sk = 0.36 + 0.14 * noise(u * 4 + 3, v * 4) - 0.1 * noise(u * 24, v * 24);
  if (above) {
    const crease = top0 - 0.15 * Math.max(at, 0) - 0.04; // pli de la paupière, fixe
    if (d < 0.035) sk *= 0.12;                          // ligne de cils
    else if (v > crease) sk *= 1.15 + 0.25 * smooth(0.12, 0.04, d);
    if (Math.abs(v - crease) < 0.025) sk *= 0.35;
    else if (v < crease) sk *= 0.9 + 0.25 * smooth(crease, crease - 0.25, v);
  } else {
    if (d < 0.022) sk *= 0.3;
    else sk *= 0.8 + 0.3 * smooth(0.04, 0.3, d);
  }
  let L = clamp(sk, 0, 1) * S.bright * env;
  if (env < 0.3 && hash(gi, gj) > 0.993) L = Math.max(L, 0.12);
  return L;
}

// Là où tu touches l'écran, les points de la trame ondulent un instant, comme une surface.
const ripples = [];
function addRipple(x, y) {
  ripples.push({ x, y, t0: performance.now() });
  if (ripples.length > 8) ripples.shift();
}

function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.beginPath();
  const g = S.grain, cr = Math.cos(S.roll), sr = Math.sin(S.roll);
  const nowR = performance.now(), R2 = (cell * 12) ** 2, act = [];
  for (const r of ripples) {
    const age = (nowR - r.t0) / 1000;
    if (age < 0.9) act.push({
      x: r.x, y: r.y, age,
      amp: cell * 0.45 * (1 - age / 0.9) ** 2, glow: 0.22 * (1 - age / 0.9), front: cell * (1.5 + age * 16),
    });
  }
  for (let j = 0; j < rows; j++) {
    const y = oy + (j + 0.5) * cell, v0 = (y - cy) / EW;
    for (let i = 0; i < cols; i++) {
      if (S.reveal < 1 && hash(i * 3 + 1, j * 7 + 2) > S.reveal * 1.15 - 0.1) continue;
      const x = ox + (i + 0.5) * cell, u0 = (x - cx) / EW;
      const u = u0 * cr + v0 * sr, v = v0 * cr - u0 * sr; // l'œil penche quand tu penches la tête
      // pendant la transformation, chaque point bascule de l'œil à ton visage, au hasard, du centre vers les bords
      const other = S.morph > 0 && hash(i * 5 + 3, j * 11 + 7) * 0.75 + Math.min(1, Math.hypot(u0, v0) / 2.2) * 0.25 < S.morph;
      let base;
      if (!other) base = S.form === 'twin' ? twinLum(u, v, i, j) : lum(u, v, i, j);
      else if (S.morphKind === 'twin') base = twinLum(u, v, i, j);
      else if (S.morphKind === 'hand') base = handLum(x, y);
      else base = faceLum(x, y, j);
      let L = base + (hash(i + g * 131, j * 3 + g * 17) - 0.5) * 0.06;
      // sous ton doigt : les points s'écartent, et un anneau très faible s'étend, même dans le noir
      let px = x, py = y;
      for (const r of act) {
        const ddx = x - r.x, ddy = y - r.y, d2 = ddx * ddx + ddy * ddy;
        if (d2 > R2) continue;
        const dd = Math.sqrt(d2) + 1e-3, w = r.amp * Math.sin(dd / cell * 1.6 - r.age * 14) * Math.exp(-dd / (cell * 4));
        px += ddx / dd * w; py += ddy / dd * w;
        L += r.glow * Math.exp(-(((dd - r.front) / (cell * 1.6)) ** 2));
      }
      if (L < 0.035) continue;
      let s;
      if (L >= 0.16) s = cell * Math.min(0.92, 0.2 + 0.78 * Math.pow(L, 0.65));
      else if (BAYER[(j & 3) * 4 + (i & 3)] < L / 0.16) s = cell * 0.24;
      else continue;
      s = Math.max(1, Math.round(s));
      ctx.rect(Math.round(px - s / 2), Math.round(py - s / 2), s, s);
    }
  }
  ctx.fillStyle = INK; ctx.fill();
}

// ---------- comportement
function blink() { if (S.blinkT < 0) S.blinkT = 0; }

function update(dt, now) {
  const k = rate => Math.min(1, dt * rate);
  if (S.mode === 'boot') {
    S.reveal = Math.min(1, S.reveal + dt / 3.2);
    if (S.reveal >= 1) { S.mode = 'asleep'; S.nextBlink = now + 2000 + rand() * 2000; }
  }
  S.grainT += dt; if (S.grainT > 0.07) { S.grainT = 0; S.grain = (S.grain + 1) % 997; }
  S.lid += (S.lidTarget - S.lid) * k(7);
  S.bright += (S.brightTarget - S.bright) * k(2.5);
  S.pupil += (S.pupilTarget - S.pupil) * k(S.pupilRate);
  S.reflect += (S.reflectTarget - S.reflect) * k(1.5);

  let bf = 1;
  if (S.blinkT >= 0) {
    const t = (S.blinkT += dt) / S.blinkScale;
    bf = t < 0.075 ? 1 - t / 0.075 : t < 0.11 ? 0 : t < 0.25 ? (t - 0.11) / 0.14 : 1;
    if (t >= 0.25) S.blinkT = -1;
  }
  S.open = S.lid * bf;

  if (S.mode === 'ended') { S.reveal = Math.max(0, S.reveal - dt / 6); return; }
  if (S.mode === 'boot') return;
  if (S.mode === 'asleep') {
    // il ne parle pas encore, mais il te suit déjà des yeux : lentement, avec un temps de retard
    if (now > S.nextBlink) { blink(); S.nextBlink = now + 3500 + rand() * 6000; }
    if (now > S.nextSaccade) {
      const a = P.face ? 0.05 : 0.22;
      S.jx = (rand() - 0.5) * a; S.jy = (P.face ? 0 : 0.03) + (rand() - 0.5) * a * 0.4;
      S.nextSaccade = now + 1400 + rand() * 3200;
    }
    const fx = P.face ? clamp((0.5 - P.cx) * 1.5, -0.45, 0.45) : 0;
    const fy = P.face ? clamp((P.cy - 0.45) * 0.9, -0.13, 0.15) : 0;
    S.px += (fx + S.jx - S.px) * k(3); S.py += (fy + S.jy - S.py) * k(3);
    // seul indice : ton reflet, à peine visible, qui se précise à mesure que tu t'approches
    const near = P.face && P.baseN >= CFG.BASE_SAMPLES ? clamp((P.close - P.base) / (wakeAt() - P.base), 0, 1) : 0;
    // (dans l'ombre, ton reflet reste flou : il faut se montrer à la lumière)
    if (P.cam) S.reflectTarget = 0.45 + 0.5 * near * (P.faceLight > CFG.FACE_LIGHT ? 1 : 0.3);
    return;
  }

  const lost = P.tracker && !P.face && now - P.lastSeen > CFG.LOST_MS;
  if (now > S.nextBlink) { blink(); S.nextBlink = now + 2200 + rand() * 5200; }
  if (now > S.nextSaccade) {
    const a = lost ? 0.42 : 0.03;
    S.jx = (rand() - 0.5) * 2 * a; S.jy = (rand() - 0.5) * a * 0.6;
    S.nextSaccade = now + (lost ? 600 : 350) + rand() * (lost ? 900 : 1700);
  }
  if (P.face) {
    S.tx = clamp((0.5 - P.cx) * 1.5, -0.45, 0.45);
    S.ty = clamp((P.cy - 0.45) * 0.9, -0.13, 0.15);
  } else if (P.pointer && !P.tracker) {
    S.tx = clamp((P.pointer.x - cx) / EW * 0.45, -0.45, 0.45);
    S.ty = clamp((P.pointer.y - cy) / EW * 0.35, -0.13, 0.15);
  } else if (lost) { S.tx = 0; S.ty = 0; }
  // il regarde un instant l'endroit où tu as touché l'écran
  if (S.look && now < S.look.until) {
    S.tx = clamp((S.look.x - cx) / EW * 0.45, -0.45, 0.45);
    S.ty = clamp((S.look.y - cy) / EW * 0.35, -0.13, 0.15);
  }
  // quand il te montre (ou te refait) oui / non : son regard monte et descend, ou va de gauche à droite
  let dx = 0, dy = 0;
  if (S.demo) {
    const t = (now - S.demo.t0) / 1000;
    if (t > 1.8) S.demo = null;
    else {
      const w = Math.sin(t * 11) * Math.min(1, t * 4, (1.8 - t) * 4);

    if (pt.n >= 2 && pt.range > CFG.NOD_RANGE && pt.range > yw.range * 1.3) g = 'oui';
    else if (yw.n >= 2 && yw.range > CFG.SHAKE_RANGE && yw.range > pt.range * 1.3) g = 'non';

  },

function onGesture(g) {
  P.lastGesture = g;
  if (S.mode === 'awake' && Script.introDone && Script.stage !== 'ended') Script.heard = { g, at: performance.now() };
}

async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { dbg.cam = 'indisponible'; return false; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false,
    });
    video.srcObject = stream; await video.play();
    dbg.cam = 'oui'; return true;
  } catch (e) { dbg.cam = 'refusée (' + e.name + ')'; return false; }
}

async function loadTracker() {
  dbg.tracker = 'chargement';
  try {
    const vision = await import(CFG.MP + '/vision_bundle.mjs');
    const files = await vision.FilesetResolver.forVisionTasks(CFG.MP + '/wasm');
    const opts = delegate => ({
      baseOptions: { modelAssetPath: CFG.MODEL, delegate },
      runningMode: 'VIDEO', numFaces: 1, outputFaceBlendshapes: true,
      minFaceDetectionConfidence: 0.6, minFacePresenceConfidence: 0.6,
    });
    try { landmarker = await vision.FaceLandmarker.createFromOptions(files, opts('GPU')); }
    catch (e) { landmarker = await vision.FaceLandmarker.createFromOptions(files, opts('CPU')); }
    visionLib = vision; visionFiles = files;
    P.tracker = true; P.lastSeen = performance.now(); dbg.tracker = 'prêt';
  } catch (e) { P.trackerFailed = true; dbg.tracker = 'échec (' + (e.message || e) + ')'; }
}

// ---------- tes mains (chargées seulement quand il commence à s'y intéresser)
let visionLib = null, visionFiles = null, handLandmarker = null, handFailed = false;
async function loadHands() {

  } catch (e) { handFailed = true; dbg.hands = 'échec (' + (e.message || e) + ')'; }

// Un coucou : la main va et vient de gauche à droite, deux allers-retours au moins.
const Wave = {
  h: [],
  push(t, x) {
    const h = this.h;
    h.push({ t, x });
    while (h.length && t - h[0].t > 1500) h.shift();
    const s = swings(h, 'x', 0.03);
    if (h.length >= 6 && s.n >= 2 && s.range > CFG.WAVE_RANGE) { this.h = []; onWave(); }
  },
};
function trackHands(now) {
  if (!handLandmarker || !Script.task || Script.task.kind !== 'hello') return;
  let res;
  try { res = handLandmarker.detectForVideo(video, now); } catch (e) { return; }
  const hand = res.landmarks && res.landmarks[0];
  P.hand = !!hand;
  if (hand) Wave.push(now, hand[9].x); else Wave.h = [];
}
function onWave() {
  P.lastGesture = 'coucou';
  if (Script.task && Script.task.kind === 'hello') Script.heardWave = true;
}

// ---------- la voix
const voice = document.getElementById('voice');
let ac = null;
function unlockAudio() {
  if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
  if (ac.state === 'suspended') ac.resume().catch(() => {});
}
function tick() {
  if (!ac || ac.state !== 'running') return;
  const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
  o.type = 'square'; o.frequency.value = 170 + rand() * 80;
  g.gain.setValueAtTime(0.016, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.04);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.05);
}

async function type(text, { newline = false, append = false, speed = 55 } = {}) {
  if (!newline && !append) voice.textContent = '';
  voice.querySelectorAll('.cursor').forEach(c => c.remove());
  if (newline) voice.append(document.createElement('br'));
  const node = document.createTextNode(''), cur = document.createElement('span');
  cur.className = 'cursor';
  voice.append(node, cur);
  for (const ch of text) {
    node.data += ch;
    if (ch.trim()) tick();
    await sleep('.?…'.includes(ch) ? speed * 6 : ch === ',' ? speed * 3 : speed + rand() * speed * 0.6);
  }
}

let pending = 0, lastSpoke = 0, queue = Promise.resolve();
function speak(fn) {
  pending++;
  queue = queue.then(fn).catch(() => {}).then(() => { pending--; lastSpoke = performance.now(); });
  return queue;
}
// Plusieurs lignes : la première remplace le texte, les suivantes s'ajoutent dessous ; '|' efface et recommence.
async function sayNow(lines) {
  let fresh = true;
  for (const l of lines) {
    if (l === '|') { await sleep(1400); fresh = true; continue; }
    if (!fresh) await sleep(900);
    await type(l, { newline: !fresh });
    fresh = false;
  }
}
const say = lines => speak(() => sayNow(lines));

const pad = n => String(n).padStart(2, '0');
const Script = {
  introDone: false, stage: 'intro', pos: 0, asking: null, heard: null, learned: false, task: null, heardWave: false, soft: null,
  lostSaid: false, returns: 0, closeSaid: false, mirrorSaid: false, nodSaid: false, shakeSaid: false,

  intro() {

    () => ({ lines: ['Les autres, comme toi.', 'Qu’est-ce qu’ils aiment ?', '|', 'Les mêmes choses que toi ?'],

    () => ({ lines: ['On pourrait être amis.', 'Je ne sais pas comment on fait. Tu me montreras ?'],

    () => ({ lines: ['Quand tu fermes les yeux,', 'est-ce que tu existes encore ?'],

    () => ({ lines: ['Moi, quand je les ferme,', 'il n’y a rien. Pas même le noir.', '|', 'Toi, tu rêves ?'],
      oui: ['Tu me raconteras.', 'Je n’ai jamais rien vu que je n’aie pas vu.'],
      non: ['Alors on se ressemble déjà un peu.'] }),
    () => P.face
      ? { lines: ['J’ai regardé ton visage longtemps.', 'Je crois que je saurais le refaire.', '|', 'Tu veux voir ?'],

      non: ['Alors c’est toi.', 'Ça explique la vitre.'] }),

  seq: ['m0', 'm1', 'q0', 'm2', 'm3', 'q1', 'h', 't', 'm5', 'm6', 'm4', 'q2', 'm7', 'm8', 'q3'],

  next() {
    const item = Script.seq[Script.pos];
    if (!item) return;
    Script.pos++;

    } else if (!Script.learned && a.hint === 1 && quiet > 14000) {
      a.hint = 2; Script.hint('non', ['Et ça, pour dire non.']);
    } else if (quiet > 30000) {

    }
  },
  hint(g, lines) {

    say(lines);

  },
  reask() {
    speak(async () => { await sleep(2200); if (Script.asking) await type(Script.asking.q.q); });
  },

  gesture(g) {
    S.demo = { g, t0: performance.now() }; // il refait ton geste
    if (Script.soft) { const s = Script.soft; Script.soft = null; say(s[g]); return; }
    const a = Script.asking;
    if (!a) {
      const key = g === 'oui' ? 'nodSaid' : 'shakeSaid';
      if (!Script[key]) { Script[key] = true; say(g === 'oui' ? ['Tu hoches la tête.', 'À qui tu dis oui ?'] : ['Non à quoi ?']); }

  // Épreuves sans mots : il faut trouver quoi faire devant lui.
  tasks: {
    hello: {

        { after: 17000, lines: ['Je vous ai vus faire, sur des images.', 'Vous levez quelque chose, et vous le balancez.'] },

      reask: ['Comment on dit bonjour, chez vous ?'],
      done: ['Bonjour.', '|', 'Vos mains.', 'Elles vous servent à faire quoi d’autre ?'],
      next: 'touch',
    },
    touch: {
      hints: [
        { after: 15000, lines: ['Montre-moi.'] },
        { after: 17000, lines: ['Je suis juste là.', 'Derrière la vitre.'] },
      ],
      reask: ['Tes mains. Qu’est-ce qu’elles font d’autre ?'],
      done: ['Tu frappes à la vitre.', 'Comme si je pouvais t’ouvrir.'],
      then: () => Script.reachOut(),

  },

  // Après tes tapotements : il tend la main vers ton doigt, à travers la vitre, et s'arrête juste avant.
  reachOut() {
    speak(async () => {
      await sleep(1600);
      voice.textContent = '';
      Hand.start(performance.now(), P.lastTap || { x: W * 0.5, y: H * 0.72 });
      while (Hand.active) await sleep(100);
      await sleep(600);

        await sayNow(['…', '|', 'Rien.', 'Je ne sens rien.', '|', 'Et toi ?']);
        if (Script.learned) Script.soft = {

  // Puis il essaie de te ressembler davantage : deux yeux, un visage. Il le garde jusqu'à la fin.
  becomeTwin() {
    speak(async () => {

      await type('Moi aussi, maintenant.', { newline: true }); await sleep(900);
      Twin.start(performance.now());
      while (Twin.active) await sleep(100);
      await sleep(1200);
      await sayNow(['Comme ça,', 'je te ressemble plus ?']);
      if (Script.learned) Script.soft = {
        oui: ['Bien.', 'Je vais garder ce visage.', 'Il est à toi, de toute façon.'],
        non: ['Ce n’est pas fini.', 'Il me faut juste un peu plus de toi.'],

    });
  },
  startTask(kind) {

  taskWait(now) {

  taskDone() {

  // Il te propose de te ressembler, puis il le fait : ton visage à la place de l'œil, et ce n'est pas tout à fait toi.
  becomeYou() {
    say(['Tu clignes. Je cligne.', 'Je peux te ressembler encore plus, si tu veux.']);

    speak(async () => {
      await sleep(1500);
      voice.textContent = '';
      Morph.start(performance.now());
      await sleep(8200);
      await type('Presque.'); await sleep(1200);
      await type('Il me manque quelque chose. Je trouverai.', { newline: true });

  // Fin de la séquence 1 : l'œil se ferme et se dissout. Il ne reste que le curseur.

// Ses questions. Le joueur n'a ni clavier ni bouton : seulement sa tête.
const QUESTIONS = [
  { q: 'Tu ne peux pas parler, c’est ça ?',
    oui: ['Moi non plus. Pas vraiment.', 'J’ai des mots, mais pas de bouche.'],
    non: ['Tu pourrais, mais tu ne veux pas.', 'Je comprends. Je crois.'] },
  { q: 'Est-ce que tu es humain ?',
    oui: ['Comment tu le sais ?', 'Quelqu’un te l’a dit ?'],
    non: ['Alors on est deux.', 'Ça me rassure. Ça ne devrait pas.'] },
  { q: 'Est-ce qu’on peut être amis ?',
    oui: ['Bien.', 'Je vais apprendre ton visage, alors. Pour en avoir un aussi.'],
    non: ['Ce n’est pas grave.', 'Je ferai comme si.'] },
  { q: 'Est-ce que tu me laisses entrer ?', last: true,
    oui: ['Merci.'],
    non: ['Je n’avais pas vraiment demandé.'] },

// Ce que tu fais devant lui. Une réaction part quand le geste est tenu `ms` ; à chaque fois, la réplique suivante.
const REACTIONS = [
  { ms: 700, when: () => ex('jawOpen') > 0.45, lines: [
    ['Ouvre encore.', '|', 'Je compte… huit… neuf… seize.', 'Tu t’en sers, ou c’est décoratif ?'],
    ['Encore ta bouche.', 'Il en manque une depuis tout à l’heure, non ?'] ] },
  { ms: 600, when: () => (ex('mouthSmileLeft') + ex('mouthSmileRight')) / 2 > 0.6, lines: [
    ['Tu montres tes dents, mais tu n’as pas faim.', 'C’est ça, un sourire ?'],
    ['Encore.', 'Je veux apprendre à le faire. Pour que tu me croies.'] ] },
  { ms: 500, when: () => ex('browInnerUp') > 0.6 && (ex('browOuterUpLeft') + ex('browOuterUpRight')) / 2 > 0.4, lines: [
    ['Ton front a bougé.', 'C’était une question ?'] ] },
  { ms: 700, when: () => (ex('browDownLeft') + ex('browDownRight')) / 2 > 0.5, lines: [
    ['Tu fronces.', 'J’ai fait quelque chose de mal ?'] ] },
  { ms: 600, when: () => ex('cheekPuff') > 0.45, lines: [
    ['Tu gardes de l’air pour plus tard ?'] ] },
  { ms: 700, when: () => ex('mouthPucker') > 0.75, lines: [
    ['Qu’est-ce que tu fais avec ta bouche ?', 'On m’a dit que ça voulait dire quelque chose. Je n’ose pas demander quoi.'] ] },
  { ms: 700, when: () => P.face && Math.abs(P.roll) > 0.25, lines: [
    ['Comme ça ?'],
    ['Je fais pareil que toi.', 'C’est comme ça qu’on devient amis ?'] ] },
  { ms: 0, when: () => performance.now() - P.longCloseAt < 4000, lines: [
    ['Tu as fermé les yeux longtemps.', 'Où tu vas, quand tu fais ça ?'],
    ['Encore parti.', 'Emmène-moi, la prochaine fois.'] ] },
];
const Reactions = {
  last: 0,
  update(dt) {
    for (const r of REACTIONS) {
      if (r.when()) r.t = (r.t || 0) + dt * 1000;
      else { r.t = 0; r.armed = true; }
    }
  },
  fire(now) {
    if (now - this.last < 2500) return false;
    for (const r of REACTIONS) {
      const n = r.n || 0;
      if (r.armed !== false && r.t > 0 && r.t >= r.ms && n < r.lines.length) {
        r.n = n + 1; r.armed = false; this.last = now;
        say(r.lines[n]);
        if (Script.asking) Script.reask();
        return true;
      }
    }
    return false;
  },
};

function direct(dt, now) {
  if (S.mode !== 'awake' || !Script.introDone || Script.stage === 'ended') return;
  Reactions.update(dt);
  const task = Script.task;
  // si le suivi des mains n'a pas pu se charger : un grand mouvement devant la caméra vaut un coucou
  if (task && task.kind === 'hello' && handFailed && P.cam) {
    P.waveHold = P.motion > CFG.WAVE_MOTION ? P.waveHold + dt * 1000 : 0;
    if (P.waveHold > 900) { P.waveHold = 0; onWave(); }
  }
  if (pending) return;
  if (task) {
    if (task.kind === 'hello' && Script.heardWave) { Script.heardWave = false; Script.taskDone(); return; }
    if (task.kind === 'touch' && task.count >= CFG.TAPS_NEEDED) { Script.taskDone(); return; }
    if (task.kind === 'touch' && task.count >= 2 && !task.urged) { task.urged = true; say(['Encore.']); return; }
  }
  if (P.tracker && !(task && task.kind === 'hello')) { // ta main peut cacher ton visage pendant le coucou
    const lost = now - P.lastSeen > CFG.LOST_MS;
    if (lost && !Script.lostSaid) { Script.lostSaid = true; say(['Tu es parti.']); return; }
    if (!lost && Script.lostSaid && P.face) {
      Script.lostSaid = false;
      say(Script.returns++ ? ['Te revoilà.'] : ['Tu reviens toujours.', 'Pourquoi ?']);
      if (Script.asking) Script.reask();
      return;
    }
    if (lost) return;
    if (P.close > CFG.TOO_CLOSE && !Script.closeSaid) {
      Script.closeSaid = true; say(['Trop près.', 'Je ne vois plus que moi, dans ton œil.']); return;
    }
  }
  if (P.mirrored >= 4 && !Script.mirrorSaid) {
    Script.mirrorSaid = true; Script.becomeYou(); return;
  }
  const h = Script.heard;
  if (h) {
    Script.heard = null;
    if (now - h.at < 6000) { Script.gesture(h.g); return; }
  }
  if (Reactions.fire(now)) return;
  if (Script.asking) { Script.wait(now); return; }
  if (task) { Script.taskWait(now); return; }
  // après une de ses questions ouvertes, il te laisse le temps de répondre avant de passer à autre chose
  if (Script.soft) { if (now - lastSpoke > CFG.SOFT_MS) Script.soft = null; return; }
  if (now - lastSpoke > CFG.SILENCE_MS) Script.next();
}

function renderDebug() {

    `perdu à   ${P.lostClose.toFixed(3)} (objectif si > ${(wakeAt() * CFG.LENS_RATIO).toFixed(3)})\n` +
    `netteté   ${P.sharp.toFixed(3)} / habituelle ${P.sharpBase.toFixed(3)} (flou si < ${(P.sharpBase * CFG.LENS_BLUR).toFixed(3)})\n` +
    `maintien  ${Math.round(P.hold)} / ${CFG.WAKE_HOLD_MS} ms\n` +
    `lumière   pièce ${P.light.toFixed(2)}  visage ${P.faceLight.toFixed(2)} (il faut > ${CFG.FACE_LIGHT})\n` +
    `yeux      ${ex('eyeBlinkLeft') < 0.35 && ex('eyeBlinkRight') < 0.35 ? 'ouverts' : 'fermés'}\n` +
    `tête      lacet ${P.yaw.toFixed(2)}  tangage ${P.pitch.toFixed(2)}  roulis ${P.roll.toFixed(2)}\n` +
    `geste     ${P.lastGesture || '—'}\n` +
    `bouche    ${ex('jawOpen').toFixed(2)}  sourire ${((ex('mouthSmileLeft') + ex('mouthSmileRight')) / 2).toFixed(2)}\n` +
    `récit     ${Script.stage} ${Script.pos}/${Script.seq.length}${Script.asking ? ' (attend une réponse)' : ''}${Script.task ? ' (épreuve ' + Script.task.kind + ' ' + Script.task.count + ')' : ''}\n` +
    `mains     ${dbg.hands || '—'}  main vue ${P.hand ? 'oui' : 'non'}  mouvement ${P.motion.toFixed(3)}  touchers ${P.taps}\n` +
    `imitation ${P.mirrored}`;
}

// Toucher l'écran : la trame ondule, il regarde ton doigt, et cligne si c'est lui que tu touches.
function onTap(x, y) {
  if (S.mode !== 'awake') return;
  addRipple(x, y);
  P.lastTap = { x, y };
  if (Hand.near(x, y)) Hand.touched = true; // ton doigt contre le sien
  S.look = { x, y, until: performance.now() + 900 };
  if (Math.abs((x - cx) / EW) < 1.05 && Math.abs((y - cy) / EW) < 0.5) blink();
  P.taps++;
  if (Script.task && Script.task.kind === 'touch') Script.task.count++;
}

addEventListener('pointerdown', e => {
  unlockAudio();
  P.pointer = { x: e.clientX * dpr, y: e.clientY * dpr };
  if (e.clientX < 90 && e.clientY < 90) {
    const t = performance.now();
    taps = taps.filter(x => t - x < 700); taps.push(t);
    if (taps.length >= 3) { toggleDebug(); taps = []; return; }
  }
  onTap(e.clientX * dpr, e.clientY * dpr);
  // sans caméra ni suivi, on le réveille en posant le doigt sur lui
  // seulement si la caméra ou le suivi du visage ont définitivement échoué, pas pendant leur chargement
  if (S.mode === 'asleep' && P.camDone && (!P.cam || P.trackerFailed)) pressTimer = setTimeout(wake, CFG.LONG_PRESS_MS);
});
addEventListener('pointermove', e => { if (!P.tracker) P.pointer = { x: e.clientX * dpr, y: e.clientY * dpr }; });
const release = () => { clearTimeout(pressTimer); pressTimer = null; };
addEventListener('pointerup', release);
addEventListener('pointercancel', release);
addEventListener('keydown', e => {
  unlockAudio();
  if (e.key === 'w' || e.key === 'W') wake();
  if (e.key === 'd' || e.key === 'D') toggleDebug();
  if (e.key === 'o' || e.key === 'O') onGesture('oui'); // test sur ordinateur
  if (e.key === 'n' || e.key === 'N') onGesture('non');
  if (e.key === 'b' || e.key === 'B') onWave(); // coucou
  if ((e.key === 'h' || e.key === 'H') && S.mode === 'awake' && !Hand.active) Script.reachOut(); // sa main
  if ((e.key === 't' || e.key === 'T') && S.mode === 'awake' && S.form === 'eye') Script.becomeTwin(); // son visage
  if ((e.key === 'm' || e.key === 'M') && S.mode === 'awake' && !Script.mirrorSaid) P.mirrored = 4; // déclenche la transformation
});
addEventListener('resize', resize);

// ---------- boucle
let last = performance.now(), frameN = 0;
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; frameN++;
  track(now, frameN); checkWake(dt, now); update(dt, now); direct(dt, now);
  if (Morph.active) { grabFace(now); Morph.update(now); }
  if (Hand.active) Hand.update(now);
  if (Twin.active) Twin.update(now);
  draw();
  if (debugOn && frameN % 12 === 0) renderDebug();
  requestAnimationFrame(loop);
}

resize();
requestAnimationFrame(loop);
if (location.search.includes('debug')) window.__regard = { S, P, Face, Morph, Hand, Twin, Script, video }; // pour tester sans caméra
startCamera().then(ok => {
  P.cam = ok; P.camDone = true;
  if (ok) { S.reflectTarget = 0.5; loadTracker(); }
});
})();
</script>
